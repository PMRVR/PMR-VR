<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Blocky Tag - VR Multiplayer (Natal)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { background: #0f0f0f; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
  canvas { position: fixed; inset: 0; z-index: -1; pointer-events: none; display: block; }

  #app-container { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; }
  
  .tab-content {
    position: absolute; top: 0; left: 0; width: 100%; height: calc(100% - 70px);
    padding: 20px; overflow-y: auto;
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    z-index: 1;
  }
  .tab-content.active { transform: translateX(0); z-index: 2; }
  .tab-content.previous { transform: translateX(-20%); z-index: 0; }

  #tab-online { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #tab-online h1 { font-size: 36px; font-weight: 800; color: #00ffaa; margin-bottom: 5px; }
  #tab-online p { font-size: 14px; color: #888; margin-bottom: 30px; }
  .menu-btn { background: #00ffaa; color: #000; border: none; padding: 16px; border-radius: 12px; font-size: 18px; font-weight: 700; width: 100%; max-width: 300px; margin-bottom: 10px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; }
  .menu-btn.secondary { background: #222; color: #fff; border: 1px solid #444; }
  #join-code-input { padding: 12px; font-size: 16px; border-radius: 10px; border: 2px solid #444; background: #000; color: #fff; text-align: center; margin-bottom: 10px; width: 100%; max-width: 300px; font-family: monospace; }

  #tab-settings { display: flex; flex-direction: column; }
  #tab-settings h2 { font-size: 24px; font-weight: 700; margin-bottom: 20px; }
  .settings-group { background: #1c1c1e; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
  .settings-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #222; }
  .settings-row:last-child { border-bottom: none; }
  .settings-label { font-size: 15px; font-weight: 500; }
  .toggle { position: relative; width: 52px; height: 32px; background: rgba(255,255,255,0.2); border-radius: 16px; cursor: pointer; border: none; flex-shrink: 0; }
  .toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 28px; height: 28px; background: #fff; border-radius: 50%; transition: 0.3s; }
  .toggle.on { background: #00ffaa; }
  .toggle.on::after { transform: translateX(20px); }
  .input-field { width: 100%; padding: 12px; background: #000; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 16px; margin-top: 10px; }

  #bottom-tabs {
    height: 70px; background: #151515; border-top: 1px solid #222;
    display: flex; justify-content: space-around; align-items: center;
    z-index: 100; flex-shrink: 0;
  }
  .tab-btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 5px; color: #555; font-size: 11px; font-weight: 600; cursor: pointer;
    background: none; border: none; width: 50%; height: 100%; transition: color 0.2s;
  }
  .tab-btn i { font-size: 22px; }
  .tab-btn.active { color: #00ffaa; }

  /* UI DO JOGO */
  #game-ui { position: fixed; inset: 0; pointer-events: none; z-index: 5; display: none; }
  #game-ui.active { display: block; }
  
  #top-bar { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: flex-start; }
  #room-info { background: rgba(0,0,0,0.7); border: 1px solid #00ffaa; padding: 10px 15px; border-radius: 10px; font-family: monospace; font-size: 14px; font-weight: bold; pointer-events: auto; }
  #room-info span { color: #00ffaa; font-size: 18px; }
  
  #pause-btn { background: rgba(0,0,0,0.7); border: 1px solid #444; width: 44px; height: 44px; border-radius: 10px; color: #fff; font-size: 20px; cursor: pointer; pointer-events: auto; display: grid; place-items: center; }
  #pause-btn:active { background: #333; }

  #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; border: 2px solid #fff; border-radius: 50%; transform: translate(-50%, -50%); opacity: 0.5; }
  
  .nametag { position: fixed; top: 0; left: 0; background: rgba(0,0,0,0.7); padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; pointer-events: none; z-index: 5; transform: translate(-50%, -50%); white-space: nowrap; border: 1px solid rgba(255,255,255,0.2); color: #fff; }
  
  #voice-btn { position: fixed; bottom: 90px; right: 20px; z-index: 100; width: 60px; height: 60px; border-radius: 50%; background: #222; border: 2px solid #444; color: #fff; font-size: 24px; display: grid; place-items: center; cursor: pointer; pointer-events: auto; transition: 0.2s;}
  #voice-btn.active { background: #00ffaa; color: #000; border-color: #00ffaa; box-shadow: 0 0 20px rgba(0,255,170,0.5); }

  /* MENU DE PAUSA */
  #pause-menu { position: fixed; inset: 0; z-index: 200; background: rgba(15,15,15,0.9); backdrop-filter: blur(5px); display: none; flex-direction: column; align-items: center; justify-content: center; }
  #pause-menu.active { display: flex; }
  #pause-menu h2 { font-size: 32px; font-weight: 800; color: #00ffaa; margin-bottom: 30px; }
  .pause-btn { background: #222; color: #fff; border: 1px solid #444; padding: 15px; border-radius: 12px; font-size: 18px; font-weight: 600; width: 80%; max-width: 300px; margin-bottom: 15px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; }
  .pause-btn.primary { background: #00ffaa; color: #000; border-color: #00ffaa; }
  .pause-btn:hover { background: #333; }
  .pause-btn.primary:hover { background: #00cc88; }
</style>
</head>
<body>

<div id="app-container">
  <div id="tab-online" class="tab-content active">
    <h1>Blocky Tag</h1>
    <p>❄️ Edição de Inverno ❄️</p>
    <input type="text" id="join-code-input" placeholder="Código da Sala (ex: 1234)" />
    <button class="menu-btn" onclick="createRoom()"><i class="fa-solid fa-plus"></i> Criar Sala Pública</button>
    <button class="menu-btn secondary" onclick="joinRoom()"><i class="fa-solid fa-arrow-right-to-bracket"></i> Entrar com Código</button>
  </div>

  <div id="tab-settings" class="tab-content">
    <h2>Configurações</h2>
    <div class="settings-group">
      <div style="font-size:12px; font-weight:700; color:#00ffaa; margin-bottom:8px;">Jogador</div>
      <div class="settings-row">
        <div><div class="settings-label">Username</div></div>
      </div>
      <input type="text" id="usernameInput" class="input-field" placeholder="O teu nome..." maxlength="15" />
    </div>
    <div class="settings-group">
      <div style="font-size:12px; font-weight:700; color:#00ffaa; margin-bottom:8px;">Sistema</div>
      <div class="settings-row">
        <div><div class="settings-label">Giroscópio</div></div>
        <button class="toggle on" id="toggle-gyro" onclick="this.classList.toggle('on')"></button>
      </div>
      <div class="settings-row">
        <div><div class="settings-label">Modo de Voo</div></div>
        <button class="toggle" id="toggle-gravity" onclick="this.classList.toggle('on')"></button>
      </div>
    </div>
  </div>
</div>

<div id="bottom-tabs">
  <button class="tab-btn active" data-target="tab-online" onclick="switchTab('tab-online', this)">
    <i class="fa-solid fa-gamepad"></i><span>Jogar Online</span>
  </button>
  <button class="tab-btn" data-target="tab-settings" onclick="switchTab('tab-settings', this)">
    <i class="fa-solid fa-gear"></i><span>Configurações</span>
  </button>
</div>

<div id="game-ui">
  <div id="top-bar">
    <div id="room-info">Sala: <span id="room-code-display">------</span></div>
    <button id="pause-btn" onclick="togglePause()"><i class="fa-solid fa-bars"></i></button>
  </div>
  <div id="crosshair"></div>
  <button id="voice-btn" onclick="toggleVoiceChat()"><i class="fa-solid fa-microphone-slash"></i></button>
</div>

<div id="pause-menu">
  <h2>Pausa</h2>
  <button class="pause-btn primary" onclick="togglePause()"><i class="fa-solid fa-play"></i> Continuar</button>
  <button class="pause-btn" onclick="toggleThirdPerson()"><i class="fa-solid fa-camera"></i> <span id="camera-mode-text">Mudar para 3ª Pessoa</span></button>
  <button class="pause-btn" onclick="togglePause(); switchTab('tab-settings', document.querySelectorAll('.tab-btn')[1]);"><i class="fa-solid fa-gear"></i> Opções</button>
  <button class="pause-btn" style="color: #ff4d4d;" onclick="leaveRoom()"><i class="fa-solid fa-door-open"></i> Sair</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "socket.io-client": "https://cdn.socket.io/4.7.5/socket.io.esm.min.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21";
import { io } from "socket.io-client";

// ============ ABAS ============
window.switchTab = (targetId, btnElement) => {
  const currentTab = document.querySelector('.tab-content.active');
  const nextTab = document.getElementById(targetId);
  if (currentTab === nextTab) return;
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  btnElement.classList.add('active');
  nextTab.classList.add('active');
  nextTab.classList.remove('previous');
  currentTab.classList.remove('active');
  currentTab.classList.add('previous');
  setTimeout(() => currentTab.classList.remove('previous'), 300);
};

// ============ ESTADO GLOBAL ============
let socket = null;
let myUsername = localStorage.getItem('pmr_username') || "Jogador";
let roomCode = null;
let isMultiplayer = false;
let remotePlayers = {};
let gameStarted = false;
let isPaused = false;
let isInitialized = false;
let renderer, scene, camera;
let isThirdPerson = false;

let networkInterval = null;
let gyroInterval = null;

// Física
const playerPos = new THREE.Vector3(0, 1.6, 0);
const playerVel = new THREE.Vector3(0, 0, 0);
const GRAVITY = 28;           
const PUSH_MULTIPLIER = 250;  
const MAX_SPEED = 12;         
const AIR_DRAG = 0.90;        
const GROUND_FRICTION = 0.75; 
let isGrounded = false;

// Modelos 3D e Natal
let myBodyGroup;
let gorilaModel = null;
let leftHandBone = null;
let rightHandBone = null;
let snowParticles = null;
const colliders = [];

// Hand Tracking
let handLandmarker = null, lastVideoTime = -1;
const prevLeftPos = new THREE.Vector3();
const prevRightPos = new THREE.Vector3();
const virtualLeftHandPos = new THREE.Vector3();
const virtualRightHandPos = new THREE.Vector3();
let isLeftHandTracked = false;
let isRightHandTracked = false;

// Voz
let localStream = null;
let isVoiceActive = false;
const ICE_SERVERS = [{ urls: 'stun:stun.l.google.com:19302' }];
const peerConnections = {};

document.getElementById('usernameInput').value = myUsername;

// ============ GIROSCÓPIO (O TEU MÉTODO) ============
function initGyro() {
  if (gyroInterval) clearInterval(gyroInterval);
  
  window.addEventListener("deviceorientation", (event) => {
    if (isPaused) return;
    
    let pitch = event.beta;
    let roll = event.gamma;

    if (pitch === null || roll === null) return;

    // Limitar os valores
    pitch = Math.max(-90, Math.min(90, pitch));
    roll = Math.max(-90, Math.min(90, roll));

    // Movimento em modo paisagem
    const lookUpDown = THREE.MathUtils.degToRad(pitch);
    const lookLeftRight = THREE.MathUtils.degToRad(roll);

    // Aplica rotação à câmara
    camera.rotation.x = lookUpDown;
    camera.rotation.y = -lookLeftRight; // Invertido para paisagem
    camera.rotation.z = 0;
  });
}

// ============ MENU DE PAUSA E CÂMARA ============
window.togglePause = () => {
  isPaused = !isPaused;
  const menu = document.getElementById('pause-menu');
  if (isPaused) {
    menu.classList.add('active');
  } else {
    menu.classList.remove('active');
  }
};

window.toggleThirdPerson = () => {
  isThirdPerson = !isThirdPerson;
  document.getElementById('camera-mode-text').innerText = isThirdPerson ? "Mudar para 1ª Pessoa" : "Mudar para 3ª Pessoa";
  togglePause(); // Fecha o menu ao mudar
};

window.leaveRoom = () => {
  window.location.reload(); // Forma simples de sair e voltar ao menu inicial
};

// ============ SOCKET ============
window.createRoom = () => {
  myUsername = document.getElementById('usernameInput').value.trim() || "Jogador";
  localStorage.setItem('pmr_username', myUsername);
  roomCode = Math.floor(1000 + Math.random() * 9000).toString();
  connectToServer(roomCode);
};
window.joinRoom = () => {
  myUsername = document.getElementById('usernameInput').value.trim() || "Jogador";
  localStorage.setItem('pmr_username', myUsername);
  const code = document.getElementById('join-code-input').value.trim();
  if (!code) return alert("Insere o código!");
  roomCode = code;
  connectToServer(roomCode);
};

function connectToServer(code) {
  const serverUrl = window.location.hostname === 'localhost' ? 'http://localhost:3000' : window.location.origin;
  socket = io(serverUrl);

  socket.on('connect', () => {
    socket.emit('joinRoom', { roomCode: code, username: myUsername });
    document.getElementById('room-code-display').innerText = code;
    document.getElementById('app-container').style.display = 'none';
    document.getElementById('bottom-tabs').style.display = 'none';
    document.getElementById('game-ui').classList.add('active');
    
    isMultiplayer = true;
    initGame();
  });

  socket.on('currentPlayers', (players) => { 
    Object.keys(players).forEach(id => { 
      if (id !== socket.id) addRemotePlayer(id, players[id]); 
    }); 
  });
  
  socket.on('newPlayer', (player) => addRemotePlayer(player.id, player));
  
  socket.on('playerMoved', (data) => { 
    if (remotePlayers[data.id]) {
      remotePlayers[data.id].targetPosition.set(data.position.x, data.position.y, data.position.z);
    }
  });
  
  socket.on('playerRotated', (data) => { 
    if (remotePlayers[data.id]) {
      remotePlayers[data.id].targetRotY = data.rotY; 
    }
  });

  socket.on('playerDisconnected', (id) => {
    if (remotePlayers[id]) { 
      scene.remove(remotePlayers[id].group); 
      remotePlayers[id].nametag.remove(); 
      delete remotePlayers[id]; 
    }
  });
  
  socket.on('webrtc-offer', async (data) => {
    const pc = createPeerConnection(data.sender, false);
    await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    socket.emit('webrtc-answer', { target: data.sender, answer });
  });
  socket.on('webrtc-answer', async (data) => {
    const pc = peerConnections[data.sender];
    if (pc) await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
  });
  socket.on('webrtc-ice-candidate', async (data) => {
    const pc = peerConnections[data.sender];
    if (pc) await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
  });

  socket.on('ownerStatus', (isOwner) => { console.log('És o dono da sala:', isOwner); });
  socket.on('newOwner', (id) => { console.log('Novo dono da sala:', id); });
  socket.on('kickedError', (msg) => { alert(msg); window.location.reload(); });
  socket.on('bannedError', (msg) => { alert(msg); window.location.reload(); });
}

// ============ JOGO & NATAL ============
function initGame() {
  if (isInitialized) return;
  
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xa4cce6); // Azul gélido
  scene.fog = new THREE.Fog(0xa4cce6, 15, 60);
  
  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.domElement.style.position = 'fixed';
  renderer.domElement.style.inset = '0';
  renderer.domElement.style.zIndex = '-1';
  document.body.appendChild(renderer.domElement);
  
  scene.add(new THREE.HemisphereLight(0xffffff, 0xcccccc, 1.2));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(10, 20, 10);
  scene.add(dirLight);

  // Chão de Neve (Branco)
  const floor = new THREE.Mesh(new THREE.BoxGeometry(100, 1, 100), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  floor.position.y = -0.5; scene.add(floor);
  colliders.push(new THREE.Box3().setFromObject(floor));

  // Caixas de Gelo
  const boxMat = new THREE.MeshBasicMaterial({ color: 0xadd8e6 });
  [{ x: 5, z: -5, size: 2 }, { x: -5, z: -8, size: 3 }, { x: 0, z: -12, size: 4 }].forEach(b => {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(b.size, b.size, b.size), boxMat);
    mesh.position.set(b.x, b.size / 2, b.z); scene.add(mesh);
    colliders.push(new THREE.Box3().setFromObject(mesh));
  });

  createSnow();

  // Carregar Gorila
  myBodyGroup = new THREE.Group();
  scene.add(myBodyGroup);
  
  const loader = new GLTFLoader();
  loader.load('/gorila.glb', (gltf) => {
    gorilaModel = gltf.scene;
    myBodyGroup.add(gorilaModel);
    
    // Procurar ossos
    gorilaModel.traverse((child) => {
      if (child.isBone) {
        if (child.name === 'LeftHand') leftHandBone = child;
        if (child.name === 'RightHand') rightHandBone = child;
      }
    });
    console.log("Gorila carregado!");
  }, undefined, (err) => {
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshBasicMaterial({ color: 0x888888 }));
    head.position.y = 0.4; myBodyGroup.add(head);
  });

  // Iniciar Giroscópio
  initGyro();

  initHandTracking();
  
  // Throttle de Rede a 20Hz
  if (networkInterval) clearInterval(networkInterval);
  networkInterval = setInterval(() => {
    if (socket && isMultiplayer && roomCode && gameStarted && !isPaused) {
      socket.emit('updatePosition', { roomCode, position: { x: playerPos.x, y: playerPos.y, z: playerPos.z } });
      socket.emit('updateRotation', { roomCode, rotY: camera.rotation.y });
    }
  }, 50);

  isInitialized = true;
  gameStarted = true;
  animate();
}

// ============ SISTEMA DE NEVE ============
function createSnow() {
  const particleCount = 1000;
  const geometry = new THREE.BufferGeometry();
  const positions = new Float32Array(particleCount * 3);
  const velocities = [];

  for (let i = 0; i < particleCount; i++) {
    positions[i * 3] = (Math.random() - 0.5) * 60;
    positions[i * 3 + 1] = Math.random() * 30;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 60;
    velocities.push({ y: Math.random() * 2 + 1, x: (Math.random() - 0.5) * 0.5, z: (Math.random() - 0.5) * 0.5 });
  }

  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const material = new THREE.PointsMaterial({ color: 0xffffff, size: 0.15, transparent: true, opacity: 0.8, sizeAttenuation: true });

  snowParticles = new THREE.Points(geometry, material);
  snowParticles.userData.velocities = velocities;
  scene.add(snowParticles);
}

function updateSnow(dt) {
  if (!snowParticles) return;
  const positions = snowParticles.geometry.attributes.position.array;
  const velocities = snowParticles.userData.velocities;
  
  for (let i = 0; i < velocities.length; i++) {
    positions[i * 3 + 1] -= velocities[i].y * dt; 
    positions[i * 3] += velocities[i].x * dt;     
    positions[i * 3 + 2] += velocities[i].z * dt; 

    if (positions[i * 3 + 1] < -1) {
      positions[i * 3 + 1] = 30;
      positions[i * 3] = playerPos.x + (Math.random() - 0.5) * 60;
      positions[i * 3 + 2] = playerPos.z + (Math.random() - 0.5) * 60;
    }
  }
  snowParticles.geometry.attributes.position.needsUpdate = true;
  snowParticles.position.x = playerPos.x;
  snowParticles.position.z = playerPos.z;
}

// ============ VOICE ============
window.toggleVoiceChat = async () => {
  const btn = document.getElementById('voice-btn');
  if (!isVoiceActive) {
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
      isVoiceActive = true;
      btn.classList.add('active');
      btn.innerHTML = '<i class="fa-solid fa-microphone"></i>';
      for (let id in remotePlayers) createPeerConnection(id, true);
    } catch (e) { alert("Microfone: " + e.message); }
  } else {
    if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
    isVoiceActive = false;
    btn.classList.remove('active');
    btn.innerHTML = '<i class="fa-solid fa-microphone-slash"></i>';
    for (let id in peerConnections) { peerConnections[id].close(); delete peerConnections[id]; }
  }
};

function createPeerConnection(targetId, isInitiator) {
  if (peerConnections[targetId]) return peerConnections[targetId];
  const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
  peerConnections[targetId] = pc;
  if (localStream) localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
  pc.ontrack = (event) => { const audio = document.createElement('audio'); audio.srcObject = event.streams[0]; audio.autoplay = true; audio.volume = 1.0; document.body.appendChild(audio); };
  pc.onicecandidate = (event) => { if (event.candidate) socket.emit('webrtc-ice-candidate', { target: targetId, candidate: event.candidate }); };
  if (isInitiator) pc.createOffer().then(offer => { pc.setLocalDescription(offer); socket.emit('webrtc-offer', { target: targetId, offer }); });
  return pc;
}

// ============ HAND TRACKING ============
async function initHandTracking() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm");
    handLandmarker = await HandLandmarker.createFromOptions(vision, {
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate: "CPU" },
      runningMode: "VIDEO", numHands: 2
    });
    detectHandsLoop(stream);
  } catch (e) { console.warn('Hand Tracking falhou', e); }
}

function detectHandsLoop(stream) {
  const video = document.createElement('video');
  video.srcObject = stream; video.play();
  const loop = () => {
    requestAnimationFrame(loop);
    if (video.readyState >= 2 && video.currentTime !== lastVideoTime && !isPaused) {
      lastVideoTime = video.currentTime;
      const results = handLandmarker.detectForVideo(video, performance.now());
      if (results.landmarks) processHands(results.landmarks);
    }
  };
  loop();
}

function processHands(hands) {
  isLeftHandTracked = false;
  isRightHandTracked = false;

  hands.forEach((lm, index) => {
    const isRight = index === 1; 
    const prevPos = isRight ? prevRightPos : prevLeftPos;
    const virtualPos = isRight ? virtualRightHandPos : virtualLeftHandPos;

    const indexTip = lm[8];
    const ndcX = (1 - indexTip.x) * 2 - 1;
    const ndcY = -(indexTip.y * 2 - 1);
    
    const forward = new THREE.Vector3(); camera.getWorldDirection(forward);
    const rightVec = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0,1,0)).normalize();
    const up = new THREE.Vector3(0,1,0);
    
    const handWorldPos = new THREE.Vector3().copy(camera.position)
      .add(forward.clone().multiplyScalar(0.5))
      .add(rightVec.clone().multiplyScalar(ndcX * 0.3))
      .add(up.clone().multiplyScalar(ndcY * 0.3));

    virtualPos.copy(handWorldPos);
    if (isRight) isRightHandTracked = true;
    else isLeftHandTracked = true;

    // Física
    if (prevPos.lengthSq() > 0) {
      const delta = new THREE.Vector3().subVectors(handWorldPos, prevPos);
      if (delta.length() < 0.4) {
        const push = delta.multiplyScalar(-PUSH_MULTIPLIER);
        playerVel.add(push);
        if (playerVel.length() > MAX_SPEED) playerVel.normalize().multiplyScalar(MAX_SPEED);
      }
    }
    prevPos.copy(handWorldPos);
  });
}

// ============ INVERSE KINEMATICS ============
function applyIK(bone, targetWorldPos, isTracked) {
  if (!bone || !isTracked) return;
  const localTarget = bone.parent.worldToLocal(targetWorldPos.clone());
  bone.lookAt(localTarget);
}

// ============ LOOP A 60FPS ============
let lastTime = performance.now();
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.1); 
  lastTime = now;

  if (gameStarted && !isPaused) {
    const isZeroGravity = document.getElementById('toggle-gravity').classList.contains('on');
    if (!isZeroGravity) playerVel.y -= GRAVITY * dt;
    
    if (isGrounded) { 
      playerVel.x *= GROUND_FRICTION; 
      playerVel.z *= GROUND_FRICTION; 
    } else { 
      playerVel.x *= AIR_DRAG; 
      playerVel.z *= AIR_DRAG; 
    }

    playerPos.addScaledVector(playerVel, dt);

    if (playerPos.y < 1.6) { playerPos.y = 1.6; playerVel.y = 0; isGrounded = true; }
    else { isGrounded = false; }

    // === LÓGICA DE CÂMARA (1ª vs 3ª Pessoa) ===
    if (isThirdPerson) {
      // Câmara atrás do jogador
      const offset = new THREE.Vector3(0, 1.5, 4); // Altura e distância
      offset.applyEuler(new THREE.Euler(0, camera.rotation.y, 0)); // Segue a rotação Y
      camera.position.copy(playerPos).add(offset);
      // A câmara olha para o jogador
      camera.lookAt(playerPos.x, playerPos.y + 0.5, playerPos.z);
    } else {
      // 1ª Pessoa
      camera.position.copy(playerPos);
    }
    
    if (myBodyGroup) {
      myBodyGroup.position.copy(playerPos).add(new THREE.Vector3(0, -0.4, 0));
      // Em 3ª pessoa, o corpo roda com a câmara
      myBodyGroup.rotation.y = camera.rotation.y; 

      if (gorilaModel) {
        applyIK(leftHandBone, virtualLeftHandPos, isLeftHandTracked);
        applyIK(rightHandBone, virtualRightHandPos, isRightHandTracked);
      }
    }

    updateSnow(dt);

    Object.keys(remotePlayers).forEach(id => {
      const rp = remotePlayers[id];
      if (rp.targetPosition) rp.group.position.lerp(rp.targetPosition, 0.2);
      if (rp.targetRotY !== undefined) {
        let diff = rp.targetRotY - rp.group.rotation.y;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        rp.group.rotation.y += diff * 0.2;
      }
    });

    renderer.render(scene, camera);
  }
}

// ============ OUTROS JOGADORES ============
function addRemotePlayer(id, player) {
  const group = new THREE.Group();
  
  const loader = new GLTFLoader();
  loader.load('/gorila.glb', (gltf) => {
    const remoteModel = gltf.scene.clone();
    group.add(remoteModel);
  }, undefined, () => {
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshBasicMaterial({ color: 0x888888 }));
    head.position.y = 0.4; group.add(head);
  });

  group.position.set(player.position.x, player.position.y, player.position.z); 
  group.rotation.y = player.rotY || 0;
  scene.add(group);

  const nametag = document.createElement('div');
  nametag.className = 'nametag';
  nametag.innerText = player.username;
  document.body.appendChild(nametag);

  remotePlayers[id] = { 
    group, 
    username: player.username, 
    targetPosition: new THREE.Vector3(player.position.x, player.position.y, player.position.z),
    targetRotY: player.rotY, 
    nametag 
  };
}

window.addEventListener('resize', () => {
  if (camera) { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }
});
</script>

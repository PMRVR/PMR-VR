<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Blocky Tag - Adicionamos mais bugs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { background: #0f0f0f; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
  canvas { position: fixed; inset: 0; z-index: -1; pointer-events: none; display: block; }

  .screen { position: fixed; inset: 0; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; z-index: 10; background: #0f0f0f; }
  .screen.active { display: flex; }

  /* MENU */
  #menu-screen h1 { font-size: 36px; font-weight: 800; color: #00ffaa; margin-bottom: 5px; }
  #menu-screen p { font-size: 14px; color: #888; margin-bottom: 30px; }
  #usernameInput { padding: 12px 20px; font-size: 16px; border-radius: 10px; border: 2px solid #444; background: #222; color: #fff; text-align: center; margin-bottom: 20px; width: 100%; max-width: 300px; }
  .menu-btn { background: #00ffaa; color: #000; border: none; padding: 16px; border-radius: 12px; font-size: 18px; font-weight: 700; width: 100%; max-width: 300px; margin-bottom: 10px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px;}
  .menu-btn.secondary { background: #222; color: #fff; border: 1px solid #444; }
  #join-code-input { padding: 12px; font-size: 16px; border-radius: 10px; border: 2px solid #444; background: #000; color: #fff; text-align: center; margin-bottom: 10px; width: 100%; max-width: 300px; font-family: monospace; }

  /* HUD */
  #game-ui { position: fixed; inset: 0; pointer-events: none; z-index: 5; display: none; }
  #game-ui.active { display: block; }
  #room-info { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7); border: 1px solid #00ffaa; padding: 10px 15px; border-radius: 10px; font-family: monospace; font-size: 14px; font-weight: bold; }
  #room-info span { color: #00ffaa; font-size: 18px; }
  #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; border: 2px solid #fff; border-radius: 50%; transform: translate(-50%, -50%); opacity: 0.5; }
  .nametag { position: fixed; top: 0; left: 0; background: rgba(0,0,0,0.7); padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; pointer-events: none; z-index: 5; transform: translate(-50%, -50%); white-space: nowrap; border: 1px solid rgba(255,255,255,0.2); }

  /* SETTINGS E MODERAÇÃO */
  #settings-btn { position: fixed; top: 10px; right: 10px; z-index: 100; background: rgba(0,0,0,0.8); border: 1px solid #444; color: #fff; padding: 8px; border-radius: 8px; cursor: pointer; }
  #settings-panel { position: fixed; top: 60px; right: 10px; width: 300px; background: rgba(20,20,20,0.98); border: 1px solid #444; border-radius: 12px; display: none; flex-direction: column; z-index: 200; max-height: 80vh; overflow-y: auto; }
  #settings-panel.show { display: flex; }
  .settings-header { padding: 15px; border-bottom: 1px solid #333; font-weight: 700; }
  .setting-row { display: flex; justify-content: space-between; padding: 15px; border-bottom: 1px solid #222; font-size: 14px; align-items: center; }
  .toggle { width: 40px; height: 20px; background: #333; border-radius: 10px; position: relative; cursor: pointer; }
  .toggle.on { background: #00ffaa; }
  .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: #fff; border-radius: 50%; transition: 0.2s; }
  .toggle.on::after { transform: translateX(20px); }
  .mod-btn { background: #ff4444; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; margin-left: 5px; }
  .mod-btn.ban { background: #ffaa00; color: #000; }

  /* VOICE CHAT */
  #voice-btn { position: fixed; bottom: 20px; right: 20px; z-index: 100; width: 60px; height: 60px; border-radius: 50%; background: #222; border: 2px solid #444; color: #fff; font-size: 24px; display: grid; place-items: center; cursor: pointer; }
  #voice-btn.active { background: #00ffaa; color: #000; border-color: #00ffaa; }

  /* MODAL COOKIES */
  #cookie-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: flex-end; z-index: 1000; }
  #cookie-modal.show { display: flex; }
  .cookie-box { background: #1c1c1e; width: 100%; max-width: 500px; padding: 20px; border-radius: 20px 20px 0 0; animation: slideUp 0.3s; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
</style>
</head>
<body>

<!-- MENU -->
<div id="menu-screen" class="screen active">
  <h1>Blocky Tag</h1>
  <p>Update: Adicionamos mais bugs pra corrigir depois</p>
  <input type="text" id="usernameInput" placeholder="O teu nome..." maxlength="15" />
  <button class="menu-btn" onclick="createRoom()"><i class="fa-solid fa-plus"></i> Criar Sala</button>
  <input type="text" id="join-code-input" placeholder="Código da Sala (ex: 1234)" />
  <button class="menu-btn secondary" onclick="joinRoom()"><i class="fa-solid fa-arrow-right-to-bracket"></i> Entrar</button>
</div>

<!-- HUD -->
<div id="game-ui">
  <div id="room-info">Sala: <span id="room-code-display">------</span></div>
  <div id="crosshair"></div>
  <button id="settings-btn" onclick="toggleSettings()"><i class="fa-solid fa-gear"></i></button>
  <button id="voice-btn" onclick="toggleVoice()"><i class="fa-solid fa-microphone-slash"></i></button>
  
  <div id="settings-panel">
    <div class="settings-header">Configurações</div>
    <div class="setting-row"><span>Modo de Voo (Gravidade)</span><div class="toggle" id="toggle-gravity" onclick="this.classList.toggle('on')"></div></div>
    <div id="admin-panel" style="display: none;">
      <div class="settings-header" style="color: #ff4444;">👑 Painel do Dono</div>
      <div id="player-mod-list" style="padding: 10px;"></div>
    </div>
    <button class="menu-btn secondary" style="margin: 15px; width: calc(100% - 30px);" onclick="toggleSettings()">Fechar</button>
  </div>
</div>

<!-- MODAL DE COOKIES -->
<div id="cookie-modal">
  <div class="cookie-box">
    <h3>Privacidade e Cookies</h3>
    <p style="color: #888; font-size: 13px; margin: 10px 0 20px 0;">Este jogo usa o microfone para o Voice Chat e armazena o teu nome localmente. Não recolhemos dados.</p>
    <button class="menu-btn" onclick="document.getElementById('cookie-modal').classList.remove('show')">Aceitar e Jogar</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "socket.io-client": "https://cdn.socket.io/4.7.5/socket.io.esm.min.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21";
import { io } from "socket.io-client";

// ============ VARIÁVEIS GLOBAIS ============
let socket = null;
let myUsername = "Jogador";
let roomCode = null;
let isMultiplayer = false;
let remotePlayers = {};
let gameStarted = false;
let isInitialized = false;
let renderer, scene, camera;
let isOwner = false;
const colliders = [];
const peerConnections = {};

// Física
const playerPos = new THREE.Vector3(0, 1.6, 0);
const playerVel = new THREE.Vector3(0, 0, 0);
const GRAVITY = 28;           
const PUSH_MULTIPLIER = 250;  
const MAX_SPEED = 12;         
const AIR_DRAG = 0.90;        
const GROUND_FRICTION = 0.75; 
let isGrounded = false;
let isGrabbing = false;

// Hand Tracking
let handLandmarker = null, lastVideoTime = -1;
const prevLeftPos = new THREE.Vector3();
const prevRightPos = new THREE.Vector3();
let leftHandMesh, rightHandMesh;
let myBodyGroup;

// ============ O TEU SCRIPT DE GIROSCÓPIO ============
let gyro = { alpha: 0, beta: 0, gamma: 0 };

function iniciarGiroscopio() {
    if (!("DeviceOrientationEvent" in window)) {
        console.log("Giroscópio não suportado.");
        return;
    }

    window.addEventListener("deviceorientation", (event) => {
        gyro.alpha = event.alpha ?? 0;
        gyro.beta = event.beta ?? 0;
        gyro.gamma = event.gamma ?? 0;

        // Adaptação para rodar a câmara no Three.js
        if (camera) {
            const alphaRad = THREE.MathUtils.degToRad(gyro.alpha);
            const betaRad = THREE.MathUtils.degToRad(gyro.beta - 90);
            
            camera.rotation.order = "YXZ";
            camera.rotation.y = -alphaRad;
            camera.rotation.x = -betaRad;
        }
    });
}
iniciarGiroscopio();

// ============ MENU E SOCKET ============
window.createRoom = () => {
  myUsername = document.getElementById('usernameInput').value.trim() || "Jogador";
  roomCode = Math.floor(1000 + Math.random() * 9000).toString();
  connectToServer(roomCode);
};

window.joinRoom = () => {
  myUsername = document.getElementById('usernameInput').value.trim() || "Jogador";
  const code = document.getElementById('join-code-input').value.trim();
  if (!code) return alert("Insere o código da sala!");
  roomCode = code;
  connectToServer(roomCode);
};

function connectToServer(code) {
  const serverUrl = window.location.hostname === 'localhost' ? 'http://localhost:3000' : window.location.origin;
  socket = io(serverUrl);

  socket.on('connect', () => {
    socket.emit('joinRoom', { roomCode: code, username: myUsername });
    document.getElementById('room-code-display').innerText = code;
    document.getElementById('menu-screen').classList.remove('active');
    document.getElementById('game-ui').classList.add('active');
    document.getElementById('cookie-modal').classList.add('show');
    initGame();
  });

  socket.on('bannedError', (msg) => { alert(msg); location.reload(); });
  socket.on('kickedError', (msg) => { alert(msg); location.reload(); });
  socket.on('ownerStatus', (status) => { 
    isOwner = status; 
    if(isOwner) document.getElementById('admin-panel').style.display = 'block';
  });

  socket.on('currentPlayers', (players) => {
    Object.keys(players).forEach(id => { if (id !== socket.id) addRemotePlayer(id, players[id]); });
    renderAdminList(players);
  });

  socket.on('newPlayer', (player) => addRemotePlayer(player.id, player));
  
  socket.on('playerMoved', (data) => { 
    if (remotePlayers[data.id]) remotePlayers[data.id].group.position.lerp(new THREE.Vector3(data.position.x, data.position.y, data.position.z), 0.2); 
  });
  
  socket.on('playerRotated', (data) => { 
    if (remotePlayers[data.id]) remotePlayers[data.id].targetRotY = data.rotY; 
  });

  socket.on('playerAccessoryChanged', (data) => { 
    if (remotePlayers[data.id]) updateRemoteAccessory(remotePlayers[data.id], data.accessory); 
  });

  socket.on('playerDisconnected', (id) => {
    if (remotePlayers[id]) {
      scene.remove(remotePlayers[id].group);
      remotePlayers[id].nametag.remove();
      delete remotePlayers[id];
    }
  });
}

// ============ MOTOR DO JOGO ============
function initGame() {
  if (isInitialized) return;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x555555);
  scene.fog = new THREE.Fog(0x555555, 15, 60);
  
  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.domElement.style.position = 'fixed';
  renderer.domElement.style.inset = '0';
  renderer.domElement.style.zIndex = '-1';
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));

  // Chão e Blocos
  const floor = new THREE.Mesh(new THREE.BoxGeometry(100, 1, 100), new THREE.MeshBasicMaterial({ color: 0x888888 }));
  floor.position.y = -0.5; scene.add(floor);
  colliders.push(new THREE.Box3().setFromObject(floor));

  const boxMat = new THREE.MeshBasicMaterial({ color: 0x444444 });
  [{ x: 5, z: -5, size: 2 }, { x: -5, z: -8, size: 3 }, { x: 0, z: -12, size: 4 }].forEach(b => {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(b.size, b.size, b.size), boxMat);
    mesh.position.set(b.x, b.size / 2, b.z); scene.add(mesh);
    colliders.push(new THREE.Box3().setFromObject(mesh));
  });

  // Corpo
  const sideMat = new THREE.MeshBasicMaterial({ color: 0x888888 });
  const faceMat = new THREE.MeshBasicMaterial({ map: createFaceTexture(false) });
  const headMaterials = [sideMat, sideMat, sideMat, sideMat, faceMat, sideMat]; 

  myBodyGroup = new THREE.Group();
  const bigHead = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), headMaterials);
  bigHead.position.y = 0.4; myBodyGroup.add(bigHead);
  const belly = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.6), new THREE.MeshBasicMaterial({ color: 0x666666 }));
  belly.position.y = -0.4; myBodyGroup.add(belly);
  scene.add(myBodyGroup);

  // Mãos
  const handGeo = new THREE.BoxGeometry(0.15, 0.15, 0.15);
  leftHandMesh = new THREE.Mesh(handGeo, new THREE.MeshBasicMaterial({ color: 0x00ffaa }));
  rightHandMesh = new THREE.Mesh(handGeo, new THREE.MeshBasicMaterial({ color: 0xff00aa }));
  scene.add(leftHandMesh); scene.add(rightHandMesh);

  initHandTracking();

  isInitialized = true;
  gameStarted = true;
  animate();
}

// ============ HAND TRACKING ============
async function initHandTracking() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm");
    handLandmarker = await HandLandmarker.createFromOptions(vision, {
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate: "CPU" },
      runningMode: "VIDEO", numHands: 2
    });
    detectHandsLoop(stream);
  } catch (e) { console.warn('Hand Tracking falhou', e); }
}

function detectHandsLoop(stream) {
  const video = document.createElement('video');
  video.srcObject = stream; video.play();
  
  const loop = () => {
    requestAnimationFrame(loop);
    if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
      lastVideoTime = video.currentTime;
      const results = handLandmarker.detectForVideo(video, performance.now());
      if (results.landmarks) processHands(results.landmarks);
    }
  };
  loop();
}

function processHands(hands) {
  leftHandMesh.visible = false; rightHandMesh.visible = false;
  hands.forEach((lm, index) => {
    const isRight = index === 1; 
    const handMesh = isRight ? rightHandMesh : leftHandMesh;
    const prevPos = isRight ? prevRightPos : prevLeftPos;
    handMesh.visible = true;

    const indexTip = lm[8];
    const ndcX = (1 - indexTip.x) * 2 - 1;
    const ndcY = -(indexTip.y * 2 - 1);
    
    const forward = new THREE.Vector3(); camera.getWorldDirection(forward);
    const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0,1,0)).normalize();
    const up = new THREE.Vector3(0,1,0);
    
    const handWorldPos = new THREE.Vector3().copy(camera.position)
      .add(forward.clone().multiplyScalar(0.5))
      .add(right.clone().multiplyScalar(ndcX * 0.3))
      .add(up.clone().multiplyScalar(ndcY * 0.3));

    handMesh.position.copy(handWorldPos);

    // Física
    if (prevPos.lengthSq() > 0) {
      const delta = new THREE.Vector3().subVectors(handWorldPos, prevPos);
      if (delta.length() < 0.5) {
        const push = delta.multiplyScalar(-PUSH_MULTIPLIER);
        playerVel.add(push);
        if (playerVel.length() > MAX_SPEED) {
          playerVel.normalize().multiplyScalar(MAX_SPEED);
        }
      }
    }
    prevPos.copy(handWorldPos);
  });
}

// ============ LOOP ============
let lastTime = performance.now();
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.1); 
  lastTime = now;

  if (gameStarted) {
    const isZeroGravity = document.getElementById('toggle-gravity').classList.contains('on');
    
    if (!isZeroGravity) {
      playerVel.y -= GRAVITY * dt;
    }
    
    if (isGrounded) {
      playerVel.x *= GROUND_FRICTION;
      playerVel.z *= GROUND_FRICTION;
    } else {
      playerVel.x *= AIR_DRAG;
      playerVel.z *= AIR_DRAG;
    }

    playerPos.addScaledVector(playerVel, dt);

    if (playerPos.y < 1.6) { 
      playerPos.y = 1.6; 
      playerVel.y = 0; 
      isGrounded = true;
    } else {
      isGrounded = false;
    }

    camera.position.copy(playerPos);
    myBodyGroup.position.copy(playerPos).add(new THREE.Vector3(0, -0.4, 0));
    myBodyGroup.rotation.y = camera.rotation.y; 

    if (socket && isMultiplayer && roomCode) {
      socket.emit('updatePosition', { roomCode, position: { x: playerPos.x, y: playerPos.y, z: playerPos.z } });
      const forward = new THREE.Vector3(); camera.getWorldDirection(forward);
      socket.emit('updateRotation', { roomCode, rotY: Math.atan2(forward.x, forward.z) });
    }

    Object.keys(remotePlayers).forEach(id => {
      const rp = remotePlayers[id];
      if (rp.targetRotY !== undefined) {
        let diff = rp.targetRotY - rp.group.rotation.y;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        rp.group.rotation.y += diff * 0.2;
      }
    });

    renderer.render(scene, camera);
  }
}

// ============ OUTROS JOGADORES ============
function addRemotePlayer(id, player) {
  const group = new THREE.Group();
  const faceMat = new THREE.MeshBasicMaterial({ map: createFaceTexture(false) });
  const sideMat = new THREE.MeshBasicMaterial({ color: 0x888888 });
  const headMats = [sideMat, sideMat, sideMat, sideMat, faceMat, sideMat];

  const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), headMats);
  head.position.y = 0.4; group.add(head);
  const belly = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.6), new THREE.MeshBasicMaterial({ color: 0x666666 }));
  belly.position.y = -0.4; group.add(belly);

  group.position.set(player.position.x, player.position.y, player.position.z); 
  group.rotation.y = player.rotY || 0;
  scene.add(group);
  
  const nametag = document.createElement('div');
  nametag.className = 'nametag';
  nametag.innerText = player.username;
  document.body.appendChild(nametag);
  
  remotePlayers[id] = { group, username: player.username, faceMat, targetRotY: player.rotY, nametag };
}

function createFaceTexture(isTalking) {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#888888'; ctx.fillRect(0, 0, 256, 256);
  ctx.fillStyle = '#111'; ctx.strokeStyle = '#111'; ctx.lineWidth = 8; ctx.lineCap = 'round';

  if (isTalking) {
    ctx.beginPath(); ctx.arc(80, 100, 12, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(176, 100, 12, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(100, 160); ctx.lineTo(128, 200); ctx.lineTo(156, 160); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(70, 80); ctx.lineTo(90, 120); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(186, 80); ctx.lineTo(166, 120); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(100, 180); ctx.lineTo(156, 180); ctx.stroke();
  }
  return new THREE.CanvasTexture(canvas);
}

// ============ UI ============
window.toggleSettings = () => document.getElementById('settings-panel').classList.toggle('show');

function renderAdminList(players) {
  const list = document.getElementById('player-mod-list');
  list.innerHTML = '';
  Object.keys(players).forEach(id => {
    if (id === socket.id) return;
    const p = players[id];
    list.innerHTML += `<div class="setting-row"><span>${p.username}</span><div><button class="mod-btn" onclick="kick('${id}')">Kick</button><button class="mod-btn ban" onclick="ban('${id}')">Ban</button></div></div>`;
  });
}

window.kick = (id) => { socket.emit('moderatePlayer', { roomCode, targetId: id, action: 'kick' }); };
window.ban = (id) => { socket.emit('moderatePlayer', { roomCode, targetId: id, action: 'ban' }); };

// Voice Chat Placeholder
window.toggleVoice = () => {
  document.getElementById('voice-btn').classList.toggle('active');
  alert('Voice chat precisa do TURN server. (Placeholder)');
};

// Resize
window.addEventListener('resize', () => {
  if (camera) {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
});
</script>
</body>
</html>

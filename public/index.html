<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Blocky Tag - Settings & Multiplayer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
  * { box-sizing: border-box; margin: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { background: #111; overflow: hidden; font-family: 'Inter', sans-serif; color: #fff; }
  canvas { display: block; }

  /* MENU / LOBBY */
  #menu { position: fixed; inset: 0; z-index: 1000; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  #menu.hidden { display: none; }
  #menu h1 { font-size: 32px; margin-bottom: 20px; color: #00ffaa; font-weight: 800; }
  #usernameInput { padding: 12px 20px; font-size: 16px; border-radius: 10px; border: 2px solid #444; background: #222; color: #fff; text-align: center; margin-bottom: 20px; width: 250px; }
  #menu button { background: #222; border: 2px solid #444; color: #fff; padding: 15px 40px; font-size: 18px; margin: 8px; border-radius: 10px; cursor: pointer; width: 250px; font-weight: 600; transition: 0.2s; }
  #menu button:hover { border-color: #00ffaa; background: #333; }
  
  /* LOBBY BOX */
  #lobbyBox { display: none; flex-direction: column; align-items: center; background: #1a1a1a; padding: 20px; border-radius: 15px; border: 1px solid #333; width: 100%; max-width: 400px; margin-top: 15px; }
  #lobbyBox.show { display: flex; }
  #lobbyBox h3 { font-size: 14px; color: #00ffaa; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
  #roomCodeDisplay { font-family: monospace; font-size: 28px; font-weight: bold; color: #fff; margin-bottom: 10px; letter-spacing: 2px; }
  #shareLinkInput { width: 100%; padding: 10px; background: #000; border: 1px solid #333; border-radius: 8px; color: #888; font-size: 12px; margin-bottom: 10px; text-align: center; }
  #copyBtn { background: #00ffaa; color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; width: 100%; transition: 0.2s; }
  #copyBtn:active { transform: scale(0.95); }
  #playerList { list-style: none; width: 100%; margin-top: 15px; font-size: 14px; color: #ccc; border-top: 1px solid #333; padding-top: 10px; }
  #playerList li { padding: 5px 0; display: flex; align-items: center; gap: 8px; }
  #startGameBtn { background: #ff00aa !important; border-color: #ff00aa !important; margin-top: 20px !important; display: none; }
  #startGameBtn.show { display: block; }

  /* HUD E OUTROS */
  #hud { position: fixed; top: 20px; left: 20px; font-size: 12px; color: #888; pointer-events: none; }
  #webcam { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; opacity: 0.1; display: none; }
  #settingsBtn { position: fixed; top: 10px; right: 10px; z-index: 100; background: rgba(0,0,0,0.5); border: 1px solid #444; color: #fff; padding: 5px 10px; border-radius: 5px; font-size: 12px; cursor: pointer; }
  #version { position: fixed; bottom: 10px; right: 10px; font-size: 10px; color: #444; z-index: 100; }
  
  /* PAINEL SETTINGS */
  #settingsPanel { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.95); display: none; flex-direction: column; align-items: center; justify-content: center; overflow-y: auto; padding: 20px; }
  #settingsPanel.show { display: flex; }
  #settingsPanel h2 { margin-bottom: 20px; color: #00ffaa; }
  
  .setting-group { background: #1a1a1a; border: 1px solid #333; padding: 15px; border-radius: 10px; margin-bottom: 15px; width: 100%; max-width: 400px; }
  .setting-group h3 { font-size: 12px; color: #888; margin-bottom: 10px; text-transform: uppercase; }
  .setting-options { display: flex; gap: 10px; flex-wrap: wrap; }
  .setting-options button { background: #222; border: 2px solid #333; color: #fff; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; flex: 1; min-width: 60px; }
  .setting-options button.active { background: #00ffaa; color: #000; border-color: #00ffaa; }

  #voiceStatus { display: flex; align-items: center; gap: 10px; font-size: 14px; margin-top: 10px; }
  #voiceDot { width: 12px; height: 12px; border-radius: 50%; background: #ff4444; }
  .active-voice { background: #00ffaa !important; color: #000 !important; border-color: #00ffaa !important; }

  #closeSettings { background: #333; color: #fff; border: none; padding: 10px 30px; border-radius: 8px; cursor: pointer; margin-top: 10px; }

  .nametag { position: fixed; top: 0; left: 0; background: rgba(0,0,0,0.7); padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; pointer-events: none; z-index: 5; transform: translate(-50%, -50%); white-space: nowrap; border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center; gap: 5px; }
</style>
</head>
<body>

<div id="menu">
  <h1>Blocky Tag</h1>
  <input type="text" id="usernameInput" placeholder="O teu nome..." maxlength="15" />
  
  <button id="btnMultiplayer">🌐 Criar Sala</button>
  <button id="btnSolo">🎮 Jogar Solo</button>

  <div id="lobbyBox">
    <h3>Link para Amigo</h3>
    <div id="roomCodeDisplay"></div>
    <input type="text" id="shareLinkInput" readonly />
    <button id="copyBtn">📋 Copiar Link</button>
    <ul id="playerList"></ul>
    <button id="startGameBtn">🚀 Entrar no Jogo</button>
  </div>
</div>

<div id="hud">A carregar...</div>
<button id="settingsBtn">⚙️ Configurações</button>
<div id="version">v2.2.0</div>

<div id="settingsPanel">
  <h2>Configurações</h2>
  
  <div class="setting-group">
    <h3>🎮 Gráficos</h3>
    <div class="setting-options" id="resOptions">
      <button data-res="potato">Potato</button>
      <button data-res="low">Low</button>
      <button data-res="medium" class="active">Medium</button>
      <button data-res="high">High</button>
    </div>
  </div>

  <div class="setting-group">
    <h3>✋ Hand Tracking (FPS)</h3>
    <div class="setting-options" id="fpsOptions">
      <button data-fps="10">10</button>
      <button data-fps="20" class="active">20</button>
      <button data-fps="30">30</button>
      <button data-fps="60">60</button>
    </div>
  </div>

  <div class="setting-group">
    <h3>🎤 Voice Chat</h3>
    <div id="voiceStatus">
      <div id="voiceDot"></div>
      <span id="voiceText">Desligado</span>
    </div>
    <button id="toggleMicBtn" style="margin-top: 10px; width: 100%; padding: 10px; border-radius: 8px; background: #222; color: #fff; border: 1px solid #444; cursor: pointer;">Ativar Microfone</button>
  </div>

  <button id="closeSettings">Fechar</button>
</div>

<video id="webcam" autoplay playsinline muted></video>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "socket.io-client": "https://cdn.socket.io/4.7.5/socket.io.esm.min.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21";
import { io } from "socket.io-client";

// ============ ESTADO & SETTINGS ============
let socket = null;
let roomCode = null;
let isMultiplayer = false;
let myUsername = "Jogador";
let remotePlayers = {};
let gameStarted = false;

let renderer;
const settings = {
  res: localStorage.getItem('pmr_res') || 'medium',
  fps: parseInt(localStorage.getItem('pmr_fps') || '20', 10)
};

// ============ THREE.JS ============
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x555555);
scene.fog = new THREE.Fog(0x555555, 15, 60);
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

function createRenderer() {
  const resMap = { potato: 0.5, low: 0.75, medium: 1.0, high: 1.5 };
  const pixelRatio = Math.min(window.devicePixelRatio, resMap[settings.res] || 1);
  
  renderer = new THREE.WebGLRenderer({ antialias: settings.res === 'high', powerPreference: "high-performance" });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(pixelRatio); 
  renderer.shadowMap.enabled = false; 
  document.body.appendChild(renderer.domElement);
}
createRenderer();

scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));

// Mundo
const floor = new THREE.Mesh(new THREE.BoxGeometry(100, 1, 100), new THREE.MeshBasicMaterial({ color: 0x888888 }));
floor.position.y = -0.5;
scene.add(floor);
const boxMat = new THREE.MeshBasicMaterial({ color: 0x444444 });
[{ x: 5, z: -5, size: 2 }, { x: -5, z: -8, size: 3 }, { x: 0, z: -12, size: 4 }].forEach(b => {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(b.size, b.size, b.size), boxMat);
  mesh.position.set(b.x, b.size / 2, b.z);
  scene.add(mesh);
});

// Mãos
const handGeo = new THREE.BoxGeometry(0.15, 0.15, 0.15);
const leftHandMesh = new THREE.Mesh(handGeo, new THREE.MeshBasicMaterial({ color: 0x00ffaa }));
const rightHandMesh = new THREE.Mesh(handGeo, new THREE.MeshBasicMaterial({ color: 0xff00aa }));
scene.add(leftHandMesh);
scene.add(rightHandMesh);

// Física
const playerPos = new THREE.Vector3(0, 1.6, 0);
const playerVel = new THREE.Vector3(0, 0, 0);
const GRAVITY = 20;
const PUSH_MULTIPLIER = 350; 
const MAX_SPEED = 15;

// ============ GIROSCÓPIO ============
let baseAlpha = null;
window.addEventListener('deviceorientation', (e) => {
  if (e.alpha == null) return;
  if (baseAlpha === null) baseAlpha = e.alpha;
  const r = Math.PI / 180;
  const euler = new THREE.Euler(e.beta * r, (e.alpha - baseAlpha) * r, -e.gamma * r, 'YXZ');
  const q1 = new THREE.Quaternion().setFromEuler(euler);
  const q2 = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -Math.PI / 2);
  camera.quaternion.multiplyQuaternions(q2, q1);
}, true);

// ============ HAND TRACKING ============
let handLandmarker = null;
let lastVideoTime = -1;
let prevLeftPos = new THREE.Vector3();
let prevRightPos = new THREE.Vector3();
let lastHandDetectTime = 0;

async function initHandTracking() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: 480, height: 360 } });
    const video = document.getElementById('webcam');
    video.srcObject = stream;
    await video.play();
    video.style.display = 'block';
    const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm");
    handLandmarker = await HandLandmarker.createFromOptions(vision, {
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate: "CPU" },
      runningMode: "VIDEO", numHands: 2
    });
    document.getElementById('hud').textContent = 'Hand Tracking Ativo';
  } catch (e) { console.error(e); }
}

// ============ VOICE CHAT ============
let isMicOn = false;
let localStream = null;
let localAudioTrack = null;

async function toggleMicrophone() {
  if (!isMicOn) {
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      localAudioTrack = localStream.getAudioTracks()[0];
      isMicOn = true;
      document.getElementById('toggleMicBtn').textContent = "🔇 Desativar Microfone";
      document.getElementById('toggleMicBtn').classList.add('active-voice');
      document.getElementById('voiceDot').style.background = '#00ffaa';
      document.getElementById('voiceText').textContent = "A falar...";
      if (socket) socket.emit('toggleMute', { roomCode, muted: false });
    } catch (err) {
      document.getElementById('voiceDot').style.background = '#ff4444';
      document.getElementById('voiceText').textContent = "Microfone bloqueado";
    }
  } else {
    isMicOn = false;
    if (localAudioTrack) { localAudioTrack.stop(); localAudioTrack = null; }
    if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
    document.getElementById('toggleMicBtn').textContent = "🎤 Ativar Microfone";
    document.getElementById('toggleMicBtn').classList.remove('active-voice');
    document.getElementById('voiceDot').style.background = '#ffcc00';
    document.getElementById('voiceText').textContent = "Silenciado";
    if (socket) socket.emit('toggleMute', { roomCode, muted: true });
  }
}

// ============ MULTIPLAYER ============
function connectToServer() {
  roomCode = Math.floor(100000000000 + Math.random() * 900000000000).toString();
  const serverUrl = window.location.hostname === 'localhost' ? 'http://localhost:3000' : window.location.origin;
  socket = io(serverUrl);

  socket.on('connect', () => {
    socket.emit('joinRoom', { roomCode, username: myUsername });
    
    document.getElementById('roomCodeDisplay').textContent = roomCode;
    const link = `${window.location.origin}?room=${roomCode}`;
    document.getElementById('shareLinkInput').value = link;
    
    document.getElementById('lobbyBox').classList.add('show');
    document.getElementById('playerList').innerHTML = `<li>👤 ${myUsername} (Tu)</li>`;
  });

  socket.on('currentPlayers', (players) => {
    Object.keys(players).forEach(id => {
      if (id !== socket.id) {
        document.getElementById('playerList').innerHTML += `<li>👤 ${players[id].username}</li>`;
        addRemotePlayer(id, players[id].position, players[id].username);
      }
    });
  });

  socket.on('newPlayer', (player) => {
    document.getElementById('playerList').innerHTML += `<li>👤 ${player.username}</li>`;
    addRemotePlayer(player.id, player.position, player.username);
  });

  socket.on('playerMoved', (data) => {
    if (remotePlayers[data.id]) {
      remotePlayers[data.id].mesh.position.lerp(new THREE.Vector3(data.position.x, data.position.y, data.position.z), 0.2);
    }
  });

  socket.on('playerDisconnected', (id) => {
    if (remotePlayers[id]) {
      scene.remove(remotePlayers[id].mesh);
      remotePlayers[id].nametag.remove();
      delete remotePlayers[id];
    }
  });

  isMultiplayer = true;
  document.getElementById('startGameBtn').classList.add('show');
}

function addRemotePlayer(id, position, username) {
  const geo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
  const mat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(position.x, position.y, position.z);
  scene.add(mesh);

  const nametag = document.createElement('div');
  nametag.className = 'nametag';
  nametag.innerHTML = `<span class="mic-icon">🎙️</span> ${username}`;
  document.body.appendChild(nametag);

  remotePlayers[id] = { mesh, nametag };
}

// ============ LOOP ============
let lastTime = performance.now();
function loop() {
  requestAnimationFrame(loop);
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  if (gameStarted) {
    playerVel.y -= GRAVITY * dt;
    playerVel.x *= 0.95;
    playerVel.z *= 0.95;
    playerPos.addScaledVector(playerVel, dt);
    if (playerPos.y < 1.6) { playerPos.y = 1.6; playerVel.y = 0; }
    camera.position.copy(playerPos);

    if (socket && isMultiplayer && roomCode) {
      socket.emit('updatePosition', { roomCode, position: { x: playerPos.x, y: playerPos.y, z: playerPos.z } });
    }

    // Hand tracking logic (using FPS from settings)
    if (handLandmarker && (now - lastHandDetectTime > (1000 / settings.fps))) {
      lastHandDetectTime = now;
      const video = document.getElementById('webcam');
      if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = handLandmarker.detectForVideo(video, now);
        leftHandMesh.visible = false;
        rightHandMesh.visible = false;

        if (results.landmarks) {
          results.landmarks.forEach((lm, index) => {
            const isRight = index === 1; 
            const handMesh = isRight ? rightHandMesh : leftHandMesh;
            const prevPos = isRight ? prevRightPos : prevLeftPos;
            handMesh.visible = true;

            const indexTip = lm[8];
            const wrist = lm[0];
            const middleFinger = lm[9];
            const ndcX = (1 - indexTip.x) * 2 - 1;
            const ndcY = -(indexTip.y * 2 - 1);
            
            const forward = new THREE.Vector3();
            camera.getWorldDirection(forward);
            const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0,1,0)).normalize();
            const up = new THREE.Vector3(0,1,0);
            
            const handWorldPos = new THREE.Vector3().copy(camera.position)
              .add(forward.clone().multiplyScalar(0.6))
              .add(right.clone().multiplyScalar(ndcX * 0.4))
              .add(up.clone().multiplyScalar(ndcY * 0.4));

            handMesh.position.copy(handWorldPos);

            const dx = middleFinger.x - wrist.x;
            const dy = middleFinger.y - wrist.y;
            const dz = (middleFinger.z || 0) - (wrist.z || 0);
            handMesh.rotation.x += (Math.atan2(-dy, Math.sqrt(dx*dx + dz*dz)) - handMesh.rotation.x) * 0.5;
            handMesh.rotation.y += (Math.atan2(dx, dz) - handMesh.rotation.y) * 0.5;

            if (prevPos.lengthSq() > 0) {
              const velocity = new THREE.Vector3().subVectors(handWorldPos, prevPos);
              const pushF = velocity.dot(forward); 
              const pushR = velocity.dot(right);
              const pushU = velocity.dot(up);

              if (Math.abs(pushF) > 0.005) playerVel.addScaledVector(forward, -pushF * PUSH_MULTIPLIER);
              if (Math.abs(pushR) > 0.005) playerVel.addScaledVector(right, -pushR * PUSH_MULTIPLIER);
              if (Math.abs(pushU) > 0.005) playerVel.addScaledVector(up, -pushU * PUSH_MULTIPLIER);

              if (playerVel.length() > MAX_SPEED) playerVel.normalize().multiplyScalar(MAX_SPEED);
            }
            prevPos.copy(handWorldPos);
          });
        }
      }
    }
  }

  // Nametags
  const vector = new THREE.Vector3();
  Object.keys(remotePlayers).forEach(id => {
    const rp = remotePlayers[id];
    if (rp.mesh) {
      vector.set(rp.mesh.position.x, rp.mesh.position.y + 0.6, rp.mesh.position.z);
      vector.project(camera);
      const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
      const y = (vector.y * -0.5 + 0.5) * window.innerHeight;
      if (vector.z < 1) {
        rp.nametag.style.display = 'flex';
        rp.nametag.style.left = `${x}px`;
        rp.nametag.style.top = `${y}px`;
      } else {
        rp.nametag.style.display = 'none';
      }
    }
  });

  renderer.render(scene, camera);
}

// ============ EVENTOS E UI ============
const savedName = localStorage.getItem('pmr_username');
if (savedName) document.getElementById('usernameInput').value = savedName;

document.getElementById('btnMultiplayer').onclick = () => {
  myUsername = document.getElementById('usernameInput').value.trim() || "Jogador";
  localStorage.setItem('pmr_username', myUsername);
  
  initHandTracking();
  connectToServer();
};

document.getElementById('btnSolo').onclick = () => {
  myUsername = document.getElementById('usernameInput').value.trim() || "Jogador";
  localStorage.setItem('pmr_username', myUsername);
  
  initHandTracking();
  gameStarted = true;
  document.getElementById('menu').classList.add('hidden');
};

document.getElementById('copyBtn').onclick = () => {
  const link = document.getElementById('shareLinkInput').value;
  navigator.clipboard.writeText(link).then(() => {
    document.getElementById('copyBtn').textContent = "✅ Copiado!";
    setTimeout(() => document.getElementById('copyBtn').textContent = "📋 Copiar Link", 2000);
  });
};

document.getElementById('startGameBtn').onclick = () => {
  gameStarted = true;
  document.getElementById('menu').classList.add('hidden');
};

// SETTINGS UI
document.getElementById('settingsBtn').onclick = () => document.getElementById('settingsPanel').classList.add('show');
document.getElementById('closeSettings').onclick = () => document.getElementById('settingsPanel').classList.remove('show');
document.getElementById('toggleMicBtn').onclick = toggleMicrophone;

// Options Click Listeners
document.querySelectorAll('#resOptions button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('#resOptions button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    settings.res = btn.dataset.res;
    localStorage.setItem('pmr_res', settings.res);
    
    // Re-create renderer for new res
    if (renderer) {
      renderer.dispose();
      document.body.removeChild(renderer.domElement);
    }
    createRenderer();
  };
  if (btn.dataset.res === settings.res) btn.classList.add('active');
});

document.querySelectorAll('#fpsOptions button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('#fpsOptions button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    settings.fps = parseInt(btn.dataset.fps, 10);
    localStorage.setItem('pmr_fps', settings.fps);
  };
  if (parseInt(btn.dataset.fps) === settings.fps) btn.classList.add('active');
});

// Start Loop
loop();

window.addEventListener('resize', () => {
  if (renderer) {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
});
</script>
</body>
</html>

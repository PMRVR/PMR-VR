<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Blocky Tag - Multiplayer</title>
<style>
  * { box-sizing: border-box; margin: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { background: #111; overflow: hidden; font-family: monospace; color: #fff; }
  canvas { display: block; }

  /* MENU */
  #menu { position: fixed; inset: 0; z-index: 1000; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  #menu.hidden { display: none; }
  #menu h1 { font-size: 32px; margin-bottom: 30px; color: #00ffaa; }
  #menu button { background: #222; border: 2px solid #444; color: #fff; padding: 15px 40px; font-size: 18px; margin: 10px; border-radius: 10px; cursor: pointer; width: 250px; }
  #menu button:hover { border-color: #00ffaa; }
  #roomInfo { margin-top: 20px; font-size: 14px; color: #888; text-align: center; }
  #roomCodeDisplay { color: #00ffaa; font-size: 24px; font-weight: bold; margin: 10px 0; }

  /* HUD */
  #hud { position: fixed; top: 20px; left: 20px; font-size: 12px; color: #888; pointer-events: none; }
  #webcam { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; opacity: 0.1; display: none; }
  
  /* BOTÃO CONFIG */
  #settingsBtn { position: fixed; top: 10px; right: 10px; z-index: 100; background: rgba(0,0,0,0.5); border: 1px solid #444; color: #fff; padding: 5px 10px; border-radius: 5px; font-size: 12px; cursor: pointer; }
  #version { position: fixed; bottom: 10px; right: 10px; font-size: 10px; color: #444; z-index: 100; }

  /* PAINEL CONFIG */
  #settingsPanel { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; }
  #settingsPanel.show { display: flex; }
  #settingsPanel h2 { margin-bottom: 20px; }
  #settingsPanel button { background: #333; border: none; color: #fff; padding: 10px 30px; border-radius: 5px; cursor: pointer; }
</style>
</head>
<body>

<!-- MENU -->
<div id="menu">
  <h1>Blocky Tag</h1>
  <button id="btnMultiplayer">🌐 Jogar Multiplayer</button>
  <button id="btnSolo">🎮 Jogar Solo (Teste)</button>
  
  <div id="roomInfo">
    <div id="roomCodeDisplay"></div>
    <div id="shareLink"></div>
  </div>
</div>

<!-- HUD -->
<div id="hud">A carregar...</div>
<button id="settingsBtn">⚙️ Configurações</button>
<div id="version">v1.0.0 - Multiplayer</div>

<!-- PAINEL CONFIG -->
<div id="settingsPanel">
  <h2>Configurações</h2>
  <button id="closeSettings">Fechar</button>
</div>

<video id="webcam" autoplay playsinline muted></video>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "socket.io-client": "https://cdn.socket.io/4.7.5/socket.io.esm.min.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21";
import { io } from "socket.io-client";

// ============ ESTADO GLOBAL ============
let socket = null;
let roomCode = null;
let isMultiplayer = false;
let remotePlayers = {}; // Guarda os meshes dos outros jogadores

// ============ SETUP THREE.JS (PERFORMANCE) ============
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x555555);
scene.fog = new THREE.Fog(0x555555, 15, 60);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); 
renderer.shadowMap.enabled = false; 
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));

// ============ MUNDO ============
const worldGroup = new THREE.Group();
scene.add(worldGroup);

const floor = new THREE.Mesh(new THREE.BoxGeometry(100, 1, 100), new THREE.MeshBasicMaterial({ color: 0x888888 }));
floor.position.y = -0.5;
worldGroup.add(floor);

const boxMat = new THREE.MeshBasicMaterial({ color: 0x444444 });
[{ x: 5, z: -5, size: 2 }, { x: -5, z: -8, size: 3 }, { x: 0, z: -12, size: 4 }].forEach(b => {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(b.size, b.size, b.size), boxMat);
  mesh.position.set(b.x, b.size / 2, b.z);
  worldGroup.add(mesh);
});

// ============ MÃOS LOCAIS ============
const handGeo = new THREE.BoxGeometry(0.15, 0.15, 0.15);
const leftHandMesh = new THREE.Mesh(handGeo, new THREE.MeshBasicMaterial({ color: 0x00ffaa }));
const rightHandMesh = new THREE.Mesh(handGeo, new THREE.MeshBasicMaterial({ color: 0xff00aa }));
scene.add(leftHandMesh);
scene.add(rightHandMesh);

// ============ FÍSICA LOCAL ============
const playerPos = new THREE.Vector3(0, 1.6, 0);
const playerVel = new THREE.Vector3(0, 0, 0);
const GRAVITY = 20;
const PUSH_MULTIPLIER = 350; 
const MAX_SPEED = 15;

// ============ GIROSCÓPIO (OTIMIZADO) ============
let baseAlpha = null;
function onOrientation(e) {
  if (e.alpha == null) return;
  if (baseAlpha === null) baseAlpha = e.alpha;
  const r = Math.PI / 180;
  const euler = new THREE.Euler(e.beta * r, (e.alpha - baseAlpha) * r, -e.gamma * r, 'YXZ');
  camera.quaternion.setFromEuler(euler);
}

if ('DeviceOrientationEvent' in window) {
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(p => {
      if (p === 'granted') window.addEventListener('deviceorientation', onOrientation, true);
    });
  } else {
    window.addEventListener('deviceorientation', onOrientation, true);
  }
}

// Fallback PC
let isMouseDown = false;
let mouseX = 0, mouseY = 0;
document.addEventListener('mousemove', (e) => {
  if (isMouseDown && baseAlpha === null) {
    mouseX -= e.movementX * 0.002;
    mouseY -= e.movementY * 0.002;
    mouseY = Math.max(-Math.PI/2, Math.min(Math.PI/2, mouseY));
    camera.quaternion.setFromEuler(new THREE.Euler(mouseY, mouseX, 0, 'YXZ'));
  }
});
document.addEventListener('mousedown', () => isMouseDown = true);
document.addEventListener('mouseup', () => isMouseDown = false);

// ============ HAND TRACKING ============
let handLandmarker = null;
let lastVideoTime = -1;
let prevLeftPos = new THREE.Vector3();
let prevRightPos = new THREE.Vector3();
let lastHandDetectTime = 0;
const DETECT_INTERVAL = 50; 

async function initHandTracking() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: 480, height: 360 } });
    const video = document.getElementById('webcam');
    video.srcObject = stream;
    await video.play();
    video.style.display = 'block';

    const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm");
    handLandmarker = await HandLandmarker.createFromOptions(vision, {
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate: "CPU" },
      runningMode: "VIDEO",
      numHands: 2,
      minHandDetectionConfidence: 0.4,
      minTrackingConfidence: 0.4
    });
    document.getElementById('hud').textContent = 'Hand Tracking Ativo';
  } catch (e) { console.error(e); }
}

// ============ LOOP DE JOGO ============
let lastTime = performance.now();
function loop() {
  requestAnimationFrame(loop);
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  // Física Local
  playerVel.y -= GRAVITY * dt;
  playerVel.x *= 0.95;
  playerVel.z *= 0.95;
  playerPos.addScaledVector(playerVel, dt);

  if (playerPos.y < 1.6) { playerPos.y = 1.6; playerVel.y = 0; }
  camera.position.copy(playerPos);

  // Enviar posição para o servidor
  if (socket && isMultiplayer && roomCode) {
    socket.emit('updatePosition', { 
      roomCode, 
      position: { x: playerPos.x, y: playerPos.y, z: playerPos.z } 
    });
  }

  // Deteção de Mãos
  if (handLandmarker && (now - lastHandDetectTime > DETECT_INTERVAL)) {
    lastHandDetectTime = now;
    const video = document.getElementById('webcam');
    if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
      lastVideoTime = video.currentTime;
      const results = handLandmarker.detectForVideo(video, now);

      leftHandMesh.visible = false;
      rightHandMesh.visible = false;

      if (results.landmarks) {
        results.landmarks.forEach((lm, index) => {
          const isRight = index === 1; 
          const handMesh = isRight ? rightHandMesh : leftHandMesh;
          const prevPos = isRight ? prevRightPos : prevLeftPos;
          handMesh.visible = true;

          const indexTip = lm[8];
          const wrist = lm[0];
          const middleFinger = lm[9];

          const ndcX = (1 - indexTip.x) * 2 - 1;
          const ndcY = -(indexTip.y * 2 - 1);
          
          const forward = new THREE.Vector3();
          camera.getWorldDirection(forward);
          const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0,1,0)).normalize();
          const up = new THREE.Vector3(0,1,0);
          
          const handWorldPos = new THREE.Vector3().copy(camera.position)
            .add(forward.clone().multiplyScalar(0.6))
            .add(right.clone().multiplyScalar(ndcX * 0.4))
            .add(up.clone().multiplyScalar(ndcY * 0.4));

          handMesh.position.copy(handWorldPos);

          const dx = middleFinger.x - wrist.x;
          const dy = middleFinger.y - wrist.y;
          const dz = (middleFinger.z || 0) - (wrist.z || 0);
          handMesh.rotation.x += (Math.atan2(-dy, Math.sqrt(dx*dx + dz*dz)) - handMesh.rotation.x) * 0.5;
          handMesh.rotation.y += (Math.atan2(dx, dz) - handMesh.rotation.y) * 0.5;

          if (prevPos.lengthSq() > 0) {
            const velocity = new THREE.Vector3().subVectors(handWorldPos, prevPos);
            const pushF = velocity.dot(forward); 
            const pushR = velocity.dot(right);
            const pushU = velocity.dot(up);

            if (Math.abs(pushF) > 0.005) playerVel.addScaledVector(forward, -pushF * PUSH_MULTIPLIER);
            if (Math.abs(pushR) > 0.005) playerVel.addScaledVector(right, -pushR * PUSH_MULTIPLIER);
            if (Math.abs(pushU) > 0.005) playerVel.addScaledVector(up, -pushU * PUSH_MULTIPLIER);

            if (playerVel.length() > MAX_SPEED) playerVel.normalize().multiplyScalar(MAX_SPEED);
          }
          prevPos.copy(handWorldPos);
        });
      }
    }
  }

  renderer.render(scene, camera);
}

// ============ LÓGICA MULTIPLAYER ============
function connectToServer() {
  // Gera código de 12 dígitos (ex: 123456789012)
  roomCode = Math.floor(100000000000 + Math.random() * 900000000000).toString();
  
  // Conecta ao servidor (ajusta o URL se estiveres a usar Render/Heroku)
  const serverUrl = window.location.hostname === 'localhost' ? 'http://localhost:3000' : window.location.origin;
  socket = io(serverUrl);

  socket.on('connect', () => {
    socket.emit('joinRoom', roomCode);
    
    // Atualiza o Menu com o Link
    document.getElementById('roomCodeDisplay').textContent = `Sala: ${roomCode}`;
    const link = `${window.location.origin}?room=${roomCode}`;
    document.getElementById('shareLink').innerHTML = `Link: <a href="${link}" style="color:#00ffaa">${link}</a>`;
  });

  socket.on('currentPlayers', (players) => {
    // Cria os meshes dos jogadores que já estavam na sala
    Object.keys(players).forEach(id => {
      if (id !== socket.id) addRemotePlayer(id, players[id]);
    });
  });

  socket.on('newPlayer', (player) => {
    addRemotePlayer(player.id, player);
  });

  socket.on('playerMoved', (data) => {
    if (remotePlayers[data.id]) {
      // Suaviza o movimento dos outros jogadores
      remotePlayers[data.id].position.lerp(new THREE.Vector3(data.position.x, data.position.y, data.position.z), 0.2);
    }
  });

  socket.on('playerDisconnected', (id) => {
    if (remotePlayers[id]) {
      scene.remove(remotePlayers[id]);
      delete remotePlayers[id];
    }
  });

  isMultiplayer = true;
  document.getElementById('menu').classList.add('hidden');
}

function addRemotePlayer(id, position) {
  const geo = new THREE.BoxGeometry(0.5, 0.5, 0.5); // Cubo representando o jogador
  const mat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(position.x, position.y, position.z);
  scene.add(mesh);
  remotePlayers[id] = mesh;
}

// ============ MENU E INICIALIZAÇÃO ============
document.getElementById('btnMultiplayer').onclick = () => {
  initHandTracking();
  connectToServer();
};

document.getElementById('btnSolo').onclick = () => {
  initHandTracking();
  document.getElementById('menu').classList.add('hidden');
};

document.getElementById('settingsBtn').onclick = () => {
  document.getElementById('settingsPanel').classList.add('show');
};
document.getElementById('closeSettings').onclick = () => {
  document.getElementById('settingsPanel').classList.remove('show');
};

// Verifica se veio de um link com ?room=
const urlParams = new URLSearchParams(window.location.search);
const roomParam = urlParams.get('room');
if (roomParam) {
  roomCode = roomParam;
  initHandTracking();
  // Conecta direto à sala do link
  const serverUrl = window.location.hostname === 'localhost' ? 'http://localhost:3000' : window.location.origin;
  socket = io(serverUrl);
  socket.on('connect', () => {
    socket.emit('joinRoom', roomCode);
    document.getElementById('menu').classList.add('hidden');
  });
  socket.on('currentPlayers', (players) => {
    Object.keys(players).forEach(id => { if (id !== socket.id) addRemotePlayer(id, players[id]); });
  });
  socket.on('newPlayer', (player) => addRemotePlayer(player.id, player));
  socket.on('playerMoved', (data) => {
    if (remotePlayers[data.id]) remotePlayers[data.id].position.lerp(new THREE.Vector3(data.position.x, data.position.y, data.position.z), 0.2);
  });
  socket.on('playerDisconnected', (id) => {
    if (remotePlayers[id]) { scene.remove(remotePlayers[id]); delete remotePlayers[id]; }
  });
  isMultiplayer = true;
}

initHandTracking();
loop();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>

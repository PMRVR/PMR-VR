<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Blocky Tag</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
  * { box-sizing: border-box; margin: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { background: #111; overflow: hidden; font-family: 'Inter', sans-serif; color: #fff; }
  
  canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; display: block; }
  #menu, #settingsPanel, #toastContainer, #settingsBtn, #hud, #version, #roomIndicator { z-index: 100; }

  #menu { position: fixed; inset: 0; background: rgba(17, 17, 17, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  #menu.hidden { display: none; }
  #menu h1 { font-size: 32px; margin-bottom: 15px; color: #00ffaa; font-weight: 800; }
  
  #usernameInput { padding: 12px 20px; font-size: 16px; border-radius: 10px; border: 2px solid #444; background: #222; color: #fff; text-align: center; margin-bottom: 15px; width: 100%; max-width: 300px; }
  
  /* ABAS */
  .tabs { display: flex; gap: 5px; width: 100%; max-width: 300px; margin-bottom: 15px; background: #222; padding: 4px; border-radius: 10px; }
  .tab-btn { flex: 1; padding: 10px; background: transparent; border: none; color: #888; font-weight: 600; cursor: pointer; border-radius: 8px; transition: 0.2s; font-size: 14px; }
  .tab-btn.active { background: #444; color: #fff; }
  .tab-content { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 300px; }
  .tab-content.active { display: flex; }

  /* BOTÕES */
  .action-btn { background: #222; border: 2px solid #444; color: #fff; padding: 15px 40px; font-size: 16px; margin: 5px 0; border-radius: 10px; cursor: pointer; width: 100%; font-weight: 600; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .action-btn:hover { border-color: #00ffaa; background: #333; }
  
  #btnCreate { background: #00ffaa; color: #000; border-color: #00ffaa; }
  #btnJoin { background: #4488ff; color: #fff; border-color: #4488ff; }
  #joinCodeInput { padding: 12px; font-size: 16px; border-radius: 10px; border: 2px solid #444; background: #000; color: #fff; text-align: center; margin-bottom: 10px; width: 100%; font-family: monospace; }

  /* INDICADOR DA SALA NO CANTO (NO JOGO) */
  #roomIndicator { position: fixed; top: 20px; left: 20px; background: rgba(0,0,0,0.7); border: 1px solid #00ffaa; padding: 10px 15px; border-radius: 10px; font-family: monospace; font-size: 16px; font-weight: bold; display: none; align-items: center; gap: 10px; cursor: pointer; }
  #roomIndicator.show { display: flex; }
  #roomIndicator span { color: #00ffaa; font-size: 20px; }
  
  #hud { position: fixed; top: 20px; left: 20px; font-size: 12px; color: #888; pointer-events: none; display: none; }
  #webcam { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; opacity: 0.1; display: none; }
  
  #settingsBtn { position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,0.8); border: 1px solid #444; color: #fff; padding: 8px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  #version { position: fixed; bottom: 10px; right: 10px; font-size: 10px; color: #444; pointer-events: none; }
  
  /* PAINEL CONFIGS */
  #settingsPanel { position: fixed; top: 60px; right: 10px; background: rgba(20,20,20,0.98); border: 1px solid #444; border-radius: 12px; display: none; flex-direction: column; width: 260px; max-height: 70vh; box-shadow: 0 10px 30px rgba(0,0,0,0.8); overflow: hidden; }
  #settingsPanel.show { display: flex; }
  #settingsContent { padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
  .setting-group h3 { font-size: 11px; color: #888; text-transform: uppercase; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
  .setting-options { display: flex; gap: 4px; flex-wrap: wrap; }
  .setting-options button { background: #222; border: 1px solid #444; color: #fff; padding: 6px; border-radius: 6px; cursor: pointer; font-size: 12px; flex: 1; min-width: 45px; }
  .setting-options button.active { background: #00ffaa; color: #000; border-color: #00ffaa; font-weight: bold; }
  
  #voiceStatus { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 10px; }
  #voiceDot { width: 10px; height: 10px; border-radius: 50%; background: #ff4444; }
  .active-voice { background: #00ffaa !important; color: #000 !important; border-color: #00ffaa !important; }
  #toggleMicBtn { width: 100%; padding: 10px; border-radius: 8px; background: #222; color: #fff; border: 1px solid #444; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; gap: 5px; }
  #leaveRoomBtn { width: 100%; padding: 10px; border-radius: 8px; background: #ff4444; color: #fff; border: 1px solid #ff4444; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; gap: 5px; margin-top: 10px; font-weight: bold; }
  #closeSettings { background: #333; color: #fff; border: none; padding: 12px; cursor: pointer; font-size: 13px; border-top: 1px solid #444; display: flex; align-items: center; justify-content: center; gap: 5px; }
  
  #toastContainer { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; pointer-events: none; align-items: center; }
  .toast { background: rgba(20, 20, 20, 0.9); border: 1px solid #00ffaa; color: #fff; padding: 10px 20px; border-radius: 30px; font-size: 13px; font-weight: 600; animation: slideUp 0.3s ease-out; display: flex; align-items: center; gap: 5px; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<video id="webcam" autoplay playsinline muted></video>

<div id="menu">
  <h1>Blocky Tag</h1>
  <input type="text" id="usernameInput" placeholder="O teu nome..." maxlength="15" />
  
  <!-- ABAS -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="play">Jogar</button>
    <button class="tab-btn" data-tab="join">Entrar</button>
    <button class="tab-btn" data-tab="extra">Extra</button>
  </div>

  <!-- CONTEÚDO: JOGAR -->
  <div class="tab-content active" id="tab-play">
    <button id="btnCreate" class="action-btn">Criar Sala</button>
    <button id="btnSolo" class="action-btn">Jogar Solo</button>
  </div>

  <!-- CONTEÚDO: ENTRAR -->
  <div class="tab-content" id="tab-join">
    <input type="text" id="joinCodeInput" placeholder="Cole o código da sala" maxlength="80" />
    <button id="btnJoin" class="action-btn">Conectar</button>
  </div>

  <!-- CONTEÚDO: EXTRA -->
  <div class="tab-content" id="tab-extra">
    <button id="landscapeBtn" class="action-btn" style="background: #ffaa00; color: #000; border-color: #ffaa00;">📱 Forçar Paisagem</button>
    <button id="accessoryBtn" class="action-btn" style="background: #4488ff; border-color: #4488ff;">🎩 Acessórios</button>
  </div>
</div>

<!-- INDICADOR DA ROOM NO CANTO -->
<div id="roomIndicator" onclick="copyRoomLink()">Sala: <span id="roomCodeText">------</span> 📋</div>
<div id="hud">A carregar...</div>

<button id="settingsBtn">⚙️</button>
<div id="version">v13.0.0</div>

<div id="settingsPanel">
  <div id="settingsContent">
    <div class="setting-group">
      <h3>Gráficos</h3>
      <div class="setting-options" id="resOptions">
        <button data-res="potato">P</button><button data-res="low">L</button><button data-res="medium" class="active">M</button><button data-res="high">H</button>
      </div>
    </div>
    <div class="setting-group">
      <h3>Acessório</h3>
      <div class="setting-options" id="accOptions">
        <button data-acc="none" class="active">Nenhum</button>
        <button data-acc="hat">Chapéu</button>
        <button data-acc="bighead">Cabeça</button>
        <button data-acc="nutella">Nutella</button>
        <button data-acc="cone">Cone</button>
      </div>
    </div>
    <div class="setting-group">
      <h3>Tracking FPS</h3>
      <div class="setting-options" id="fpsOptions">
        <button data-fps="10">10</button><button data-fps="20" class="active">20</button><button data-fps="30">30</button><button data-fps="60">60</button>
      </div>
    </div>
    <div class="setting-group">
      <h3>Voice Chat</h3>
      <div id="voiceStatus"><div id="voiceDot"></div><span id="voiceText">Desligado</span></div>
      <button id="toggleMicBtn">Ativar</button>
      <button id="leaveRoomBtn">Sair da Sala</button>
    </div>
  </div>
  <button id="closeSettings">Fechar</button>
</div>

<div id="toastContainer"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "socket.io-client": "https://cdn.socket.io/4.7.5/socket.io.esm.min.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21";
import { io } from "socket.io-client";
import { CONFIG } from './configs.js';

let socket = null, roomCode = null, isMultiplayer = false, myUsername = "Jogador", remotePlayers = {}, gameStarted = false, myMuted = true, localStream = null;
const peerConnections = {};
let renderer;
const settings = { res: localStorage.getItem('pmr_res') || 'medium', fps: parseInt(localStorage.getItem('pmr_fps') || '20', 10), acc: 'none' };

function showToast(message) {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateY(20px)'; toast.style.transition = '0.3s'; setTimeout(() => toast.remove(), 300); }, 3000);
}

// ============ THREE.JS SETUP ============
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x555555);
scene.fog = new THREE.Fog(0x555555, 15, 60);
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

function createRenderer() {
  const resMap = { potato: 0.5, low: 0.75, medium: 1.0, high: 1.5 };
  const pixelRatio = Math.min(window.devicePixelRatio, resMap[settings.res] || 1);
  if (renderer) { renderer.dispose(); document.body.removeChild(renderer.domElement); }
  renderer = new THREE.WebGLRenderer({ antialias: settings.res === 'high', powerPreference: "high-performance" });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(pixelRatio); 
  renderer.shadowMap.enabled = false; 
  document.body.appendChild(renderer.domElement);
}
createRenderer();

scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));

// ============ MUNDO ============
const worldGroup = new THREE.Group();
scene.add(worldGroup);
const colliders = [];

const floor = new THREE.Mesh(new THREE.BoxGeometry(100, 1, 100), new THREE.MeshBasicMaterial({ color: 0x888888 }));
floor.position.y = -0.5;
worldGroup.add(floor);
colliders.push(new THREE.Box3().setFromObject(floor));

const boxMat = new THREE.MeshBasicMaterial({ color: 0x444444 });
[{ x: 5, z: -5, size: 2 }, { x: -5, z: -8, size: 3 }, { x: 0, z: -12, size: 4 }].forEach(b => {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(b.size, b.size, b.size), boxMat);
  mesh.position.set(b.x, b.size / 2, b.z);
  worldGroup.add(mesh);
  colliders.push(new THREE.Box3().setFromObject(mesh));
});

const stairMat = new THREE.MeshBasicMaterial({ color: 0x666688 });
for (let i = 0; i < 5; i++) {
  const step = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.5, 1.5), stairMat);
  step.position.set(0, 0.25 + (i * 0.5), -3 - (i * 1.5));
  worldGroup.add(step);
  colliders.push(new THREE.Box3().setFromObject(step));
}

// ============ CARA E CORPO ============
function createFaceTexture(isTalking) {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#888888'; ctx.fillRect(0, 0, 256, 256);
  ctx.fillStyle = '#111'; ctx.strokeStyle = '#111'; ctx.lineWidth = 8; ctx.lineCap = 'round';

  if (isTalking) {
    ctx.beginPath(); ctx.arc(80, 100, 12, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(176, 100, 12, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(100, 160); ctx.lineTo(128, 200); ctx.lineTo(156, 160); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(70, 80); ctx.lineTo(90, 120); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(186, 80); ctx.lineTo(166, 120); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(100, 180); ctx.lineTo(156, 180); ctx.stroke();
  }
  return new THREE.CanvasTexture(canvas);
}

const sideMat = new THREE.MeshBasicMaterial({ color: 0x888888 });
const faceMat = new THREE.MeshBasicMaterial({ map: createFaceTexture(false) });
const headMaterials = [sideMat, sideMat, sideMat, sideMat, faceMat, sideMat]; 

const myBodyGroup = new THREE.Group();

const bigHead = new THREE.Mesh(new THREE.BoxGeometry(CONFIG.HEAD_SIZE, CONFIG.HEAD_SIZE, CONFIG.HEAD_SIZE), headMaterials);
bigHead.position.y = 0.4; myBodyGroup.add(bigHead);

const belly = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.6), new THREE.MeshBasicMaterial({ color: 0x666666 }));
belly.position.y = -0.4; myBodyGroup.add(belly);

const hatMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.2, 16), new THREE.MeshBasicMaterial({ color: 0x111111 }));
hatMesh.position.y = 0.9; hatMesh.visible = false; myBodyGroup.add(hatMesh);

const coneMesh = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.5, 16), new THREE.MeshBasicMaterial({ color: 0xff5500 }));
coneMesh.position.y = 1.0; coneMesh.visible = false; myBodyGroup.add(coneMesh);

const nutellaMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.3, 16), new THREE.MeshBasicMaterial({ color: 0x880000 }));
nutellaMesh.position.y = 0.9; nutellaMesh.visible = false; myBodyGroup.add(nutellaMesh);
const nutellaLid = new THREE.Mesh(new THREE.CylinderGeometry(0.21, 0.21, 0.05, 16), new THREE.MeshBasicMaterial({ color: 0xffffff }));
nutellaLid.position.y = 1.07; nutellaLid.visible = false; myBodyGroup.add(nutellaLid);

const bigheadMesh = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshBasicMaterial({ color: 0x888888 }));
bigheadMesh.position.y = 0.9; bigheadMesh.visible = false; myBodyGroup.add(bigheadMesh);

scene.add(myBodyGroup);

const handGeo = new THREE.BoxGeometry(CONFIG.HAND_SIZE, CONFIG.HAND_SIZE, CONFIG.HAND_SIZE);
const leftHandMesh = new THREE.Mesh(handGeo, new THREE.MeshBasicMaterial({ color: 0x00ffaa }));
const rightHandMesh = new THREE.Mesh(handGeo, new THREE.MeshBasicMaterial({ color: 0xff00aa }));
scene.add(leftHandMesh); scene.add(rightHandMesh);

const leftHandBox = new THREE.Box3();
const rightHandBox = new THREE.Box3();
const playerBox = new THREE.Box3();

const playerPos = new THREE.Vector3(0, CONFIG.PLAYER_HEIGHT, 0);
const playerVel = new THREE.Vector3(0, 0, 0);
let isGrabbing = false, isGrounded = false;

window.addEventListener("deviceorientation", (event) => {
  if (event.alpha == null || event.beta == null) return;
  camera.rotation.y = THREE.MathUtils.degToRad(event.alpha);
  camera.rotation.x = THREE.MathUtils.degToRad(event.beta);
  camera.rotation.order = 'YXZ';
}, true);

let handLandmarker = null, lastVideoTime = -1, prevLeftPos = new THREE.Vector3(), prevRightPos = new THREE.Vector3(), lastHandDetectTime = 0;

async function initHandTracking() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: 480, height: 360 } });
    const video = document.getElementById('webcam');
    video.srcObject = stream; await video.play(); video.style.display = 'block';
    const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm");
    handLandmarker = await HandLandmarker.createFromOptions(vision, {
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate: "CPU" },
      runningMode: "VIDEO", numHands: 2
    });
    document.getElementById('hud').textContent = 'Hand Tracking Ativo';
  } catch (e) { console.error(e); }
}

// ============ VOICE CHAT ============
let audioContext = null, audioAnalyser = null, audioDataArray = null;

async function toggleMicrophone() {
  if (myMuted) {
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true }); myMuted = false;
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioContext.createMediaStreamSource(localStream);
      audioAnalyser = audioContext.createAnalyser(); audioAnalyser.fftSize = 256;
      audioDataArray = new Uint8Array(audioAnalyser.frequencyBinCount); source.connect(audioAnalyser);
      document.getElementById('toggleMicBtn').textContent = "Desativar";
      document.getElementById('toggleMicBtn').classList.add('active-voice');
      document.getElementById('voiceDot').style.background = '#00ffaa';
      document.getElementById('voiceText').textContent = "A falar...";
      if (socket) socket.emit('toggleMute', { roomCode, muted: false });
      for (let id in remotePlayers) createPeerConnection(id, true);
    } catch (err) { document.getElementById('voiceDot').style.background = '#ff4444'; document.getElementById('voiceText').textContent = "Bloqueado"; }
  } else {
    myMuted = true;
    if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
    if (audioContext) { audioContext.close(); audioContext = null; audioAnalyser = null; }
    document.getElementById('toggleMicBtn').textContent = "Ativar";
    document.getElementById('toggleMicBtn').classList.remove('active-voice');
    document.getElementById('voiceDot').style.background = '#ff4444';
    document.getElementById('voiceText').textContent = "Silenciado";
    faceMat.map = createFaceTexture(false); faceMat.needsUpdate = true;
    if (socket) socket.emit('toggleMute', { roomCode, muted: true });
  }
}

function createPeerConnection(targetId, isInitiator) {
  if (peerConnections[targetId]) return peerConnections[targetId];
  const pc = new RTCPeerConnection({
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'turn:global.relay.metered.ca:80', username: CONFIG.TURN_USERNAME, credential: CONFIG.TURN_CREDENTIAL },
      { urls: 'turn:global.relay.metered.ca:443', username: CONFIG.TURN_USERNAME, credential: CONFIG.TURN_CREDENTIAL }
    ]
  });
  peerConnections[targetId] = pc;
  if (localStream) localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
  pc.ontrack = (event) => { const audio = new Audio(); audio.srcObject = event.streams[0]; audio.play().catch(e => console.warn(e)); };
  pc.onicecandidate = (event) => { if (event.candidate) socket.emit('webrtc-ice-candidate', { target: targetId, candidate: event.candidate }); };
  if (isInitiator) pc.createOffer().then(offer => { pc.setLocalDescription(offer); socket.emit('webrtc-offer', { target: targetId, offer }); });
  return pc;
}

// ============ MULTIPLAYER ============
function setupSocketEvents() {
  socket.on('connect', () => {
    socket.emit('joinRoom', { roomCode, username: myUsername });
    document.getElementById('roomCodeText').textContent = roomCode;
    document.getElementById('roomIndicator').classList.add('show');
    document.getElementById('menu').classList.add('hidden');
    document.getElementById('hud').style.display = 'block';
    gameStarted = true;
    socket.emit('updateAccessory', { roomCode, accessory: settings.acc });
  });
  
  socket.on('currentPlayers', (players) => { Object.keys(players).forEach(id => { if (id !== socket.id) addRemotePlayer(id, players[id].position, players[id].username, players[id].rotY, players[id].accessory); }); });
  socket.on('newPlayer', (player) => { addRemotePlayer(player.id, player.position, player.username, player.rotY, player.accessory); showToast(`${player.username} entrou!`); });
  socket.on('playerMoved', (data) => { if (remotePlayers[data.id]) remotePlayers[data.id].group.position.lerp(new THREE.Vector3(data.position.x, data.position.y, data.position.z), 0.2); });
  socket.on('playerRotated', (data) => { if (remotePlayers[data.id]) remotePlayers[data.id].group.rotation.y = data.rotY; });
  socket.on('playerMuteChanged', (data) => { if (remotePlayers[data.id]) { remotePlayers[data.id].isTalking = !data.muted; remotePlayers[data.id].faceMat.map = createFaceTexture(!data.muted); remotePlayers[data.id].faceMat.needsUpdate = true; } });
  socket.on('playerAccessoryChanged', (data) => { if (remotePlayers[data.id]) updateRemoteAccessory(remotePlayers[data.id], data.accessory); });
  socket.on('playerDisconnected', (id) => { if (remotePlayers[id]) { showToast(`${remotePlayers[id].username} saiu.`); scene.remove(remotePlayers[id].group); delete remotePlayers[id]; if (peerConnections[id]) { peerConnections[id].close(); delete peerConnections[id]; } } });
  socket.on('webrtc-offer', async (data) => { const pc = createPeerConnection(data.sender, false); await pc.setRemoteDescription(new RTCSessionDescription(data.offer)); const answer = await pc.createAnswer(); await pc.setLocalDescription(answer); socket.emit('webrtc-answer', { target: data.sender, answer }); });
  socket.on('webrtc-answer', async (data) => { const pc = peerConnections[data.sender]; if (pc) await pc.setRemoteDescription(new RTCSessionDescription(data.answer)); });
  socket.on('webrtc-ice-candidate', async (data) => { const pc = peerConnections[data.sender]; if (pc) await pc.addIceCandidate(new RTCIceCandidate(data.candidate)); });
  
  isMultiplayer = true;
}

function addRemotePlayer(id, position, username, rotY, accessory) {
  const group = new THREE.Group();
  
  const remoteFaceMat = new THREE.MeshBasicMaterial({ map: createFaceTexture(false) });
  const remoteSideMat = new THREE.MeshBasicMaterial({ color: 0x888888 });
  const remoteHeadMats = [remoteSideMat, remoteSideMat, remoteSideMat, remoteSideMat, remoteFaceMat, remoteSideMat];

  const head = new THREE.Mesh(new THREE.BoxGeometry(CONFIG.HEAD_SIZE, CONFIG.HEAD_SIZE, CONFIG.HEAD_SIZE), remoteHeadMats);
  head.position.y = 0.4; group.add(head);

  const belly = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.6), new THREE.MeshBasicMaterial({ color: 0x666666 }));
  belly.position.y = -0.4; group.add(belly);

  const rHat = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.2, 16), new THREE.MeshBasicMaterial({ color: 0x111111 }));
  rHat.position.y = 0.9; rHat.visible = false; group.add(rHat);

  const rCone = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.5, 16), new THREE.MeshBasicMaterial({ color: 0xff5500 }));
  rCone.position.y = 1.0; rCone.visible = false; group.add(rCone);

  const rNutella = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.3, 16), new THREE.MeshBasicMaterial({ color: 0x880000 }));
  rNutella.position.y = 0.9; rNutella.visible = false; group.add(rNutella);
  const rNutellaLid = new THREE.Mesh(new THREE.CylinderGeometry(0.21, 0.21, 0.05, 16), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  rNutellaLid.position.y = 1.07; rNutellaLid.visible = false; group.add(rNutellaLid);

  const rBighead = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshBasicMaterial({ color: 0x888888 }));
  rBighead.position.y = 0.9; rBighead.visible = false; group.add(rBighead);

  group.position.set(position.x, position.y, position.z); group.rotation.y = rotY || 0;
  scene.add(group);
  
  const rp = { group, username, faceMat: remoteFaceMat, isTalking: false, acc: { hat: rHat, cone: rCone, nutella: rNutella, nutellaLid: rNutellaLid, bighead: rBighead } };
  updateRemoteAccessory(rp, accessory);
  remotePlayers[id] = rp; 
}

function updateRemoteAccessory(rp, accessory) {
  rp.acc.hat.visible = false; rp.acc.cone.visible = false; rp.acc.nutella.visible = false; rp.acc.nutellaLid.visible = false; rp.acc.bighead.visible = false;
  if (accessory === 'hat') rp.acc.hat.visible = true;
  if (accessory === 'cone') rp.acc.cone.visible = true;
  if (accessory === 'nutella') { rp.acc.nutella.visible = true; rp.acc.nutellaLid.visible = true; }
  if (accessory === 'bighead') rp.acc.bighead.visible = true;
}

// ============ LOOP ============
let lastTime = performance.now();
function loop() {
  requestAnimationFrame(loop);
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  if (!myMuted && audioAnalyser) {
    audioAnalyser.getByteFrequencyData(audioDataArray);
    let sum = 0; for (let i = 0; i < audioDataArray.length; i++) sum += audioDataArray[i];
    const volume = sum / audioDataArray.length;
    const isTalkingNow = volume > 20;
    
    if (!bigHead.userData.isTalking && isTalkingNow) {
      faceMat.map = createFaceTexture(true); faceMat.needsUpdate = true; bigHead.userData.isTalking = true;
      if (socket) socket.emit('toggleMute', { roomCode, muted: false, talking: true });
    } else if (bigHead.userData.isTalking && !isTalkingNow) {
      faceMat.map = createFaceTexture(false); faceMat.needsUpdate = true; bigHead.userData.isTalking = false;
      if (socket) socket.emit('toggleMute', { roomCode, muted: false, talking: false });
    }
  }

  if (gameStarted) {
    leftHandBox.setFromCenterAndSize(leftHandMesh.position, new THREE.Vector3(0.2, 0.2, 0.2));
    rightHandBox.setFromCenterAndSize(rightHandMesh.position, new THREE.Vector3(0.2, 0.2, 0.2));
    
    let touching = false;
    colliders.forEach(box => { if (leftHandBox.intersectsBox(box)) touching = true; if (rightHandBox.intersectsBox(box)) touching = true; });
    isGrabbing = touching;

    if (!isGrabbing) { playerVel.y -= CONFIG.GRAVITY * dt; } else { playerVel.y = 0; }
    if (isGrounded) { playerVel.x *= CONFIG.GROUND_FRICTION; playerVel.z *= CONFIG.GROUND_FRICTION; } else { playerVel.x *= CONFIG.AIR_DRAG; playerVel.z *= CONFIG.AIR_DRAG; }

    const prevPos = playerPos.clone();
    playerPos.addScaledVector(playerVel, dt);

    playerBox.setFromCenterAndSize(playerPos, new THREE.Vector3(CONFIG.PLAYER_RADIUS*2, 1.0, CONFIG.PLAYER_RADIUS*2));
    let colliding = false;
    for (let i = 0; i < colliders.length; i++) {
      if (playerBox.intersectsBox(colliders[i])) {
        colliding = true;
        if (playerPos.y > prevPos.y) { playerPos.y = prevPos.y; playerVel.y = 0; } 
        else if (playerPos.y < prevPos.y) { 
          if (colliders[i].max.y < 0.5) { playerPos.y = CONFIG.PLAYER_HEIGHT; playerVel.y = 0; isGrounded = true; } 
          else { playerPos.y = colliders[i].max.y + CONFIG.PLAYER_HEIGHT; playerVel.y = 0; isGrounded = true; }
        }
        if (Math.abs(playerPos.x - prevPos.x) > Math.abs(playerPos.z - prevPos.z)) { playerPos.x = prevPos.x; playerVel.x = 0; } 
        else { playerPos.z = prevPos.z; playerVel.z = 0; }
      }
    }
    if (!colliding) isGrounded = false;

    camera.position.copy(playerPos);
    myBodyGroup.position.copy(playerPos).add(new THREE.Vector3(0, -0.4, 0));
    myBodyGroup.rotation.y = camera.rotation.y; 

    if (socket && isMultiplayer && roomCode) {
      socket.emit('updatePosition', { roomCode, position: { x: playerPos.x, y: playerPos.y, z: playerPos.z } });
      const forward = new THREE.Vector3(); camera.getWorldDirection(forward);
      const bodyRotY = Math.atan2(forward.x, forward.z);
      socket.emit('updateRotation', { roomCode, rotY: bodyRotY });
    }

    if (handLandmarker && (now - lastHandDetectTime > (1000 / settings.fps))) {
      lastHandDetectTime = now;
      const video = document.getElementById('webcam');
      if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = handLandmarker.detectForVideo(video, now);
        leftHandMesh.visible = false; rightHandMesh.visible = false;

        if (results.landmarks) {
          results.landmarks.forEach((lm, index) => {
            const isRight = index === 1; 
            const handMesh = isRight ? rightHandMesh : leftHandMesh;
            const prevHandPos = isRight ? prevRightPos : prevLeftPos;
            handMesh.visible = true;

            const indexTip = lm[8]; const wrist = lm[0]; const middleFinger = lm[9];
            const ndcX = (1 - indexTip.x) * 2 - 1; const ndcY = -(indexTip.y * 2 - 1);
            
            const forward = new THREE.Vector3(); camera.getWorldDirection(forward);
            const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0,1,0)).normalize();
            const up = new THREE.Vector3(0,1,0);
            
            const handWorldPos = new THREE.Vector3().copy(camera.position)
              .add(forward.clone().multiplyScalar(0.5))
              .add(right.clone().multiplyScalar(ndcX * 0.3))
              .add(up.clone().multiplyScalar(ndcY * 0.3));

            handMesh.position.copy(handWorldPos);

            const dx = middleFinger.x - wrist.x; const dy = middleFinger.y - wrist.y; const dz = (middleFinger.z || 0) - (wrist.z || 0);
            handMesh.rotation.x += (Math.atan2(-dy, Math.sqrt(dx*dx + dz*dz)) - handMesh.rotation.x) * 0.5;
            handMesh.rotation.y += (Math.atan2(dx, dz) - handMesh.rotation.y) * 0.5;

            if (isGrabbing && prevHandPos.lengthSq() > 0) {
              const delta = new THREE.Vector3().subVectors(handWorldPos, prevHandPos);
              const push = delta.multiplyScalar(-CONFIG.PUSH_MULTIPLIER);
              playerVel.add(push);
              if (playerVel.length() > CONFIG.MAX_SPEED) playerVel.normalize().multiplyScalar(CONFIG.MAX_SPEED);
            }
            prevHandPos.copy(handWorldPos);
          });
        }
      }
    }
  }
  renderer.render(scene, camera);
}

// ============ FUNÇÕES UI ============
window.copyRoomLink = () => {
  const link = `${window.location.origin}?room=${roomCode}`;
  navigator.clipboard.writeText(link).then(() => showToast("Link da sala copiado!"));
};

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
  };
});

document.getElementById('landscapeBtn').onclick = async () => {
  try {
    if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
    if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape');
    showToast("Modo paisagem forçado!");
  } catch (err) { showToast("O teu browser não permite forçar. Roda manualmente."); }
};

document.getElementById('btnCreate').onclick = () => {
  myUsername = document.getElementById('usernameInput').value.trim() || "Jogador";
  localStorage.setItem('pmr_username', myUsername);
  initHandTracking();
  
  roomCode = Math.floor(100000000000 + Math.random() * 900000000000).toString();
  const serverUrl = window.location.hostname === 'localhost' ? 'http://localhost:3000' : window.location.origin;
  socket = io(serverUrl);
  setupSocketEvents();
};

document.getElementById('btnJoin').onclick = () => {
  const inputVal = document.getElementById('joinCodeInput').value.trim();
  if (!inputVal) return showToast("Cola o código ou link primeiro!");
  
  let parsedRoomCode = inputVal;
  if (inputVal.includes('?room=')) { parsedRoomCode = inputVal.split('?room=')[1].split('&')[0]; }
  
  roomCode = parsedRoomCode;
  myUsername = document.getElementById('usernameInput').value.trim() || "Amigo";
  localStorage.setItem('pmr_username', myUsername);
  
  initHandTracking();
  const serverUrl = window.location.hostname === 'localhost' ? 'http://localhost:3000' : window.location.origin;
  socket = io(serverUrl);
  setupSocketEvents();
};

document.getElementById('btnSolo').onclick = () => { myUsername = document.getElementById('usernameInput').value.trim() || "Jogador"; localStorage.setItem('pmr_username', myUsername); initHandTracking(); gameStarted = true; document.getElementById('menu').classList.add('hidden'); document.getElementById('hud').style.display = 'block'; };
document.getElementById('settingsBtn').onclick = () => document.getElementById('settingsPanel').classList.toggle('show');
document.getElementById('closeSettings').onclick = () => document.getElementById('settingsPanel').classList.remove('show');
document.getElementById('toggleMicBtn').onclick = toggleMicrophone;
document.getElementById('leaveRoomBtn').onclick = () => location.reload();

document.querySelectorAll('#resOptions button').forEach(btn => {
  btn.onclick = () => { document.querySelectorAll('#resOptions button').forEach(b => b.classList.remove('active')); btn.classList.add('active'); settings.res = btn.dataset.res; localStorage.setItem('pmr_res', settings.res); createRenderer(); };
});

document.querySelectorAll('#fpsOptions button').forEach(btn => {
  btn.onclick = () => { document.querySelectorAll('#fpsOptions button').forEach(b => b.classList.remove('active')); btn.classList.add('active'); settings.fps = parseInt(btn.dataset.fps, 10); localStorage.setItem('pmr_fps', settings.fps); };
});

document.querySelectorAll('#accOptions button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('#accOptions button').forEach(b => b.classList.remove('active')); btn.classList.add('active'); settings.acc = btn.dataset.acc;
    hatMesh.visible = false; coneMesh.visible = false; nutellaMesh.visible = false; nutellaLid.visible = false; bigheadMesh.visible = false;
    if (settings.acc === 'hat') hatMesh.visible = true;
    if (settings.acc === 'cone') coneMesh.visible = true;
    if (settings.acc === 'nutella') { nutellaMesh.visible = true; nutellaLid.visible = true; }
    if (settings.acc === 'bighead') bigheadMesh.visible = true;
    if (socket && roomCode) socket.emit('updateAccessory', { roomCode, accessory: settings.acc });
  };
});

document.getElementById('accessoryBtn').onclick = () => document.getElementById('settingsPanel').classList.add('show');

const urlParams = new URLSearchParams(window.location.search);
const roomParam = urlParams.get('room');
if (roomParam) {
  roomCode = roomParam; 
  myUsername = localStorage.getItem('pmr_username') || prompt("O teu nome:", "Amigo") || "Amigo"; 
  localStorage.setItem('pmr_username', myUsername);
  initHandTracking();
  const serverUrl = window.location.hostname === 'localhost' ? 'http://localhost:3000' : window.location.origin;
  socket = io(serverUrl);
  setupSocketEvents();
}

loop();
window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
</script>
